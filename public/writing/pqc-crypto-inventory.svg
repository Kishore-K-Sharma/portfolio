<svg viewBox="0 0 800 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-inv">
  <title id="t-inv">Cryptographic inventory prioritization: confidentiality lifetime versus exposure</title>
  <style>
    .text{fill:#1a1a24;font-family:Inter,system-ui,sans-serif;font-size:12.5px}
    .label{fill:#5c5c66;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:10.5px;letter-spacing:.08em}
    .mono{fill:#1a1a24;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11px}
    .acc{fill:#6028d9;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11px}
    .danger{fill:#c14545;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11px}
    .s{stroke:#1a1a24;fill:none;stroke-width:1.25}
    .a{stroke:#6028d9;fill:none;stroke-width:1.5}
    .dg{stroke:#c14545;fill:none;stroke-width:1.25}
    .fdgc{fill:#c14545;opacity:0.12}
    .fs{fill:#f5f1e6}
    @media (prefers-color-scheme: dark){
      .text{fill:#e8e4d8}.label{fill:#9c9ca6}.mono{fill:#e8e4d8}.acc{fill:#b89be8}.danger{fill:#d97a7a}
      .s{stroke:#e8e4d8}.a{stroke:#b89be8}.dg{stroke:#d97a7a}.fdgc{fill:#d97a7a;opacity:0.16}.fs{fill:#1a1a24}
    }
  </style>

  <rect x="0" y="0" width="800" height="360" class="fs"/>
  <text x="40" y="34" class="label">CRYPTO INVENTORY · PRIORITIZE BY CONFIDENTIALITY LIFETIME × EXPOSURE</text>

  <!-- axis labels -->
  <text x="30" y="200" class="label" transform="rotate(-90 30 200)" text-anchor="middle">CONFIDENTIALITY LIFETIME &#8594;</text>
  <text x="400" y="352" class="label" text-anchor="middle">EXPOSURE &#8594;</text>
  <text x="70" y="72" class="label">LONG</text>
  <text x="70" y="322" class="label">SHORT</text>
  <text x="120" y="340" class="label">LOW</text>
  <text x="680" y="340" class="label">HIGH</text>

  <!-- grid -->
  <rect x="110" y="60" width="620" height="260" class="s"/>
  <line x1="420" y1="60" x2="420" y2="320" class="s"/>
  <line x1="110" y1="190" x2="730" y2="190" class="s"/>

  <!-- top-right: MIGRATE FIRST -->
  <rect x="420" y="60" width="310" height="130" class="fdgc"/>
  <text x="435" y="82" class="danger" style="font-weight:700">MIGRATE FIRST</text>
  <text x="435" y="104" class="mono">long-term archives</text>
  <text x="435" y="122" class="mono">health / financial records</text>
  <text x="435" y="140" class="mono">internet-facing TLS,</text>
  <text x="435" y="156" class="mono">sensitive payloads</text>
  <text x="435" y="180" class="danger">&#9432; harvest-now-decrypt-later zone</text>

  <!-- top-left: second -->
  <text x="125" y="82" class="acc">SECOND</text>
  <text x="125" y="104" class="mono">long-lived secrets,</text>
  <text x="125" y="122" class="mono">internal-only paths</text>
  <text x="125" y="144" class="mono">DB-at-rest keys,</text>
  <text x="125" y="162" class="mono">backup encryption</text>

  <!-- bottom-right: third -->
  <text x="435" y="212" class="acc">THIRD</text>
  <text x="435" y="234" class="mono">internet-facing</text>
  <text x="435" y="252" class="mono">session TLS</text>
  <text x="435" y="274" class="mono">ephemeral tokens,</text>
  <text x="435" y="292" class="mono">short-lived JWTs</text>

  <!-- bottom-left: lowest -->
  <text x="125" y="212" class="label">LOWEST</text>
  <text x="125" y="234" class="mono">internal short-lived</text>
  <text x="125" y="252" class="mono">session keys</text>

  <!-- signature callout -->
  <rect x="110" y="60" width="620" height="260" class="s" fill="none"/>
  <line x1="580" y1="298" x2="720" y2="298" class="a"/>
  <text x="435" y="312" class="acc">Code-signing keys: a separate long-horizon signature concern (plan ML-DSA, less HNDL-urgent).</text>
</svg>
