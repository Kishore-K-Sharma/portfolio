<svg viewBox="0 0 800 380" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-vibe-breaks">
  <title id="t-vibe-breaks">Where vibe coding shines and where it hits a wall</title>
  <style>
    .text{fill:#1a1a24;font-family:Inter,system-ui,sans-serif;font-size:13px}
    .label{fill:#5c5c66;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:10.5px;letter-spacing:.08em}
    .mono{fill:#1a1a24;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11.5px}
    .acc{fill:#6028d9;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11px}
    .danger{fill:#c14545;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:10.5px;letter-spacing:.08em}
    .s{stroke:#1a1a24;fill:none;stroke-width:1.25}
    .sm{stroke:#b3b3bd;fill:none;stroke-width:1;stroke-dasharray:4 4}
    .a{stroke:#6028d9;fill:none;stroke-width:1.5}
    .dg{stroke:#c14545;fill:none;stroke-width:1.25}
    .fa{fill:#6028d9}
    .fd{fill:#c14545}
    .fs{fill:#f5f1e6}
    @media (prefers-color-scheme: dark){
      .text{fill:#e8e4d8}.label{fill:#9c9ca6}.mono{fill:#e8e4d8}.acc{fill:#b89be8}.danger{fill:#d97a7a}
      .s{stroke:#e8e4d8}.sm{stroke:#4a4a55}.a{stroke:#b89be8}.dg{stroke:#d97a7a}
      .fa{fill:#b89be8}.fd{fill:#d97a7a}.fs{fill:#1a1a24}
    }
  </style>

  <text x="40" y="36" class="label">VIBE CODING · A BRILLIANT TOOL · WITH A SHAPED EDGE</text>

  <text x="40" y="78" class="acc">WORKS HERE</text>
  <line x1="40" y1="86" x2="370" y2="86" class="a"/>

  <rect x="40" y="102" width="330" height="44" rx="3" class="fs"/>
  <rect x="40" y="102" width="330" height="44" rx="3" class="a"/>
  <text x="56" y="122" class="mono">prototypes · explore an idea fast</text>
  <text x="56" y="138" class="label">CONSEQUENCES: NONE IF YOU THROW IT AWAY</text>

  <rect x="40" y="156" width="330" height="44" rx="3" class="fs"/>
  <rect x="40" y="156" width="330" height="44" rx="3" class="a"/>
  <text x="56" y="176" class="mono">internal scripts · one-shot jobs</text>
  <text x="56" y="192" class="label">CONSEQUENCES: BLAST RADIUS = YOU</text>

  <rect x="40" y="210" width="330" height="44" rx="3" class="fs"/>
  <rect x="40" y="210" width="330" height="44" rx="3" class="a"/>
  <text x="56" y="230" class="mono">demos · pitch decks · weekend hacks</text>
  <text x="56" y="246" class="label">CONSEQUENCES: NOBODY DEPLOYS THE DEMO</text>

  <rect x="40" y="264" width="330" height="44" rx="3" class="fs"/>
  <rect x="40" y="264" width="330" height="44" rx="3" class="a"/>
  <text x="56" y="284" class="mono">learning · feel out a new framework</text>
  <text x="56" y="300" class="label">CONSEQUENCES: ONLY YOUR TIME</text>

  <text x="430" y="78" class="danger">BREAKS HERE</text>
  <line x1="430" y1="86" x2="760" y2="86" class="dg"/>

  <rect x="430" y="102" width="330" height="44" rx="3" class="dg"/>
  <text x="446" y="122" class="mono">prod systems · users depend on it</text>
  <text x="446" y="138" class="danger">CONSEQUENCES: WAKES YOU UP AT 2AM</text>

  <rect x="430" y="156" width="330" height="44" rx="3" class="dg"/>
  <text x="446" y="176" class="mono">security paths · auth, payments, PII</text>
  <text x="446" y="192" class="danger">CONSEQUENCES: BREACH, FINES, FIRING</text>

  <rect x="430" y="210" width="330" height="44" rx="3" class="dg"/>
  <text x="446" y="230" class="mono">team code · others will modify it</text>
  <text x="446" y="246" class="danger">CONSEQUENCES: COMPOUNDING CONFUSION</text>

  <rect x="430" y="264" width="330" height="44" rx="3" class="dg"/>
  <text x="446" y="284" class="mono">load-bearing infra · platforms, libs</text>
  <text x="446" y="300" class="danger">CONSEQUENCES: EVERYONE INHERITS YOUR DEBT</text>

  <text x="400" y="346" text-anchor="middle" class="label">THE TOOL ISN'T THE PROBLEM · USING IT WHERE THE BLAST RADIUS IS WRONG IS</text>
</svg>
