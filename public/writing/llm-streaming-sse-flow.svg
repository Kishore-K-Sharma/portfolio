<svg viewBox="0 0 800 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-sse-flow">
  <title id="t-sse-flow">One SSE connection carries token frames from the LLM provider through your server to the client; a client disconnect cancels the upstream call</title>
  <style>
    .text{fill:#1a1a24;font-family:Inter,system-ui,sans-serif;font-size:13px}
    .label{fill:#5c5c66;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:10.5px;letter-spacing:.08em}
    .mono{fill:#1a1a24;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11.5px}
    .acc{fill:#6028d9;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11px}
    .danger{fill:#c14545;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:10.5px;letter-spacing:.08em}
    .s{stroke:#1a1a24;fill:none;stroke-width:1.25}
    .sm{stroke:#b3b3bd;fill:none;stroke-width:1;stroke-dasharray:4 4}
    .a{stroke:#6028d9;fill:none;stroke-width:1.5}
    .dg{stroke:#c14545;fill:none;stroke-width:1.25}
    .fa{fill:#6028d9}
    .fd{fill:#c14545}
    .fs{fill:#f5f1e6}
    @media (prefers-color-scheme: dark){
      .text{fill:#e8e4d8}.label{fill:#9c9ca6}.mono{fill:#e8e4d8}.acc{fill:#b89be8}.danger{fill:#d97a7a}
      .s{stroke:#e8e4d8}.sm{stroke:#4a4a55}.a{stroke:#b89be8}.dg{stroke:#d97a7a}
      .fa{fill:#b89be8}.fd{fill:#d97a7a}.fs{fill:#1a1a24}
    }
  </style>

  <text x="40" y="34" class="label">ONE LONG-LIVED SSE CONNECTION · TOKENS FLOW AS THEY ARE GENERATED</text>

  <!-- Client -->
  <rect x="40" y="80" width="150" height="86" rx="4" class="s"/>
  <text x="115" y="108" text-anchor="middle" class="acc">CLIENT</text>
  <text x="115" y="128" text-anchor="middle" class="text">EventSource /</text>
  <text x="115" y="144" text-anchor="middle" class="text">fetch reader</text>
  <text x="115" y="160" text-anchor="middle" class="label">RENDERS DELTAS</text>

  <!-- Your server -->
  <rect x="325" y="80" width="150" height="86" rx="4" class="s"/>
  <text x="400" y="108" text-anchor="middle" class="acc">YOUR SERVER</text>
  <text x="400" y="128" text-anchor="middle" class="text">NestJS / Express</text>
  <text x="400" y="144" text-anchor="middle" class="text">SSE endpoint</text>
  <text x="400" y="160" text-anchor="middle" class="label">PROXY + RELAY</text>

  <!-- LLM provider -->
  <rect x="610" y="80" width="150" height="86" rx="4" class="fs"/>
  <rect x="610" y="80" width="150" height="86" rx="4" class="a"/>
  <text x="685" y="108" text-anchor="middle" class="acc">LLM PROVIDER</text>
  <text x="685" y="128" text-anchor="middle" class="text">streaming API</text>
  <text x="685" y="144" text-anchor="middle" class="text">token-by-token</text>
  <text x="685" y="160" text-anchor="middle" class="label">YOU PAY PER TOKEN</text>

  <!-- token frames: client <- server -->
  <line x1="325" y1="112" x2="195" y2="112" class="a"/>
  <polygon points="195,112 205,107 205,117" class="fa"/>
  <text x="260" y="106" text-anchor="middle" class="mono">data: {tok}</text>

  <!-- token frames: server <- provider -->
  <line x1="610" y1="112" x2="480" y2="112" class="a"/>
  <polygon points="480,112 490,107 490,117" class="fa"/>
  <text x="545" y="106" text-anchor="middle" class="mono">text_delta</text>

  <!-- open request: client -> server -> provider (faint) -->
  <line x1="195" y1="150" x2="320" y2="150" class="sm"/>
  <polygon points="320,150 310,145 310,155" class="fa"/>
  <line x1="480" y1="150" x2="605" y2="150" class="sm"/>
  <polygon points="605,150 595,145 595,155" class="fa"/>
  <text x="400" y="186" text-anchor="middle" class="label">OPEN ONCE → STREAM MANY</text>

  <!-- disconnect / cancel path -->
  <line x1="40" y1="230" x2="760" y2="230" class="sm"/>
  <text x="40" y="256" class="danger">CLIENT DISCONNECT → CANCEL UPSTREAM</text>

  <!-- dashed danger path from client back to provider -->
  <path d="M115 270 L115 296 L685 296 L685 270" class="dg" stroke-dasharray="5 4"/>
  <polygon points="685,270 680,280 690,280" class="fd"/>
  <text x="400" y="290" text-anchor="middle" class="danger">req.on('close') → AbortController.abort() → STOP PAYING</text>

  <text x="115" y="266" text-anchor="middle" class="label">TAB CLOSED</text>
  <text x="685" y="266" text-anchor="middle" class="label">TOKENS STOP</text>
</svg>
