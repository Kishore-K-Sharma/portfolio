<svg viewBox="0 0 800 380" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-sprawl">
  <title id="t-sprawl">Five separate systems each with their own ops burden, versus one Postgres wearing five hats</title>
  <style>
    .text{fill:#1a1a24;font-family:Inter,system-ui,sans-serif;font-size:13px}
    .label{fill:#5c5c66;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:10.5px;letter-spacing:.08em}
    .mono{fill:#1a1a24;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11.5px}
    .acc{fill:#6028d9;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11px}
    .danger{fill:#c14545;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:10.5px;letter-spacing:.08em}
    .s{stroke:#1a1a24;fill:none;stroke-width:1.25}
    .sm{stroke:#b3b3bd;fill:none;stroke-width:1;stroke-dasharray:4 4}
    .a{stroke:#6028d9;fill:none;stroke-width:1.5}
    .dg{stroke:#c14545;fill:none;stroke-width:1.25}
    .fa{fill:#6028d9}
    .fd{fill:#c14545}
    .fs{fill:#f5f1e6}
    @media (prefers-color-scheme: dark){
      .text{fill:#e8e4d8}.label{fill:#9c9ca6}.mono{fill:#e8e4d8}.acc{fill:#b89be8}.danger{fill:#d97a7a}
      .s{stroke:#e8e4d8}.sm{stroke:#4a4a55}.a{stroke:#b89be8}.dg{stroke:#d97a7a}
      .fa{fill:#b89be8}.fd{fill:#d97a7a}.fs{fill:#1a1a24}
    }
  </style>

  <!-- LEFT: BEFORE -->
  <text x="30" y="34" class="danger">BEFORE · FIVE SYSTEMS · FIVE FAILURE MODES</text>

  <!-- five stacked boxes -->
  <rect x="30" y="56" width="150" height="46" rx="4" class="dg"/>
  <text x="44" y="78" class="mono">Redis</text>
  <text x="44" y="94" class="label">CACHE · PUB/SUB</text>

  <rect x="30" y="112" width="150" height="46" rx="4" class="dg"/>
  <text x="44" y="134" class="mono">Kafka / RabbitMQ</text>
  <text x="44" y="150" class="label">JOB QUEUE</text>

  <rect x="30" y="168" width="150" height="46" rx="4" class="dg"/>
  <text x="44" y="190" class="mono">Elasticsearch</text>
  <text x="44" y="206" class="label">FULL-TEXT SEARCH</text>

  <rect x="30" y="224" width="150" height="46" rx="4" class="dg"/>
  <text x="44" y="246" class="mono">Vector DB</text>
  <text x="44" y="262" class="label">SIMILARITY</text>

  <rect x="30" y="280" width="150" height="46" rx="4" class="dg"/>
  <text x="44" y="302" class="mono">Postgres</text>
  <text x="44" y="318" class="label">THE ACTUAL DATA</text>

  <!-- shared ops burden bracket -->
  <line x1="190" y1="56" x2="190" y2="326" class="sm"/>
  <line x1="190" y1="56" x2="200" y2="56" class="sm"/>
  <line x1="190" y1="326" x2="200" y2="326" class="sm"/>
  <text x="206" y="178" class="danger">×5 BACKUP</text>
  <text x="206" y="196" class="danger">×5 SECURE</text>
  <text x="206" y="214" class="danger">×5 MONITOR</text>
  <text x="206" y="232" class="danger">×5 UPGRADE</text>
  <text x="206" y="250" class="danger">×5 PAY FOR</text>

  <!-- divider -->
  <line x1="400" y1="40" x2="400" y2="340" class="sm"/>

  <!-- arrow across -->
  <line x1="340" y1="358" x2="430" y2="358" class="a"/>
  <polygon points="430,358 420,353 420,363" class="fa"/>
  <text x="385" y="350" text-anchor="middle" class="acc">collapse</text>

  <!-- RIGHT: AFTER -->
  <text x="440" y="34" class="acc">AFTER · ONE SYSTEM YOU ALREADY RUN</text>

  <!-- one big postgres box -->
  <rect x="500" y="120" width="180" height="150" rx="4" class="fs"/>
  <rect x="500" y="120" width="180" height="150" rx="4" class="a"/>
  <text x="590" y="156" text-anchor="middle" class="mono">Postgres</text>
  <text x="590" y="174" text-anchor="middle" class="label">ONE BOX · ONE BACKUP</text>
  <line x1="520" y1="188" x2="660" y2="188" class="sm"/>
  <text x="590" y="210" text-anchor="middle" class="text">does all five jobs</text>
  <text x="590" y="234" text-anchor="middle" class="text">one source of truth</text>
  <text x="590" y="258" text-anchor="middle" class="label">UNTIL A MEASURED LIMIT</text>

  <!-- five hats / capability tags -->
  <rect x="448" y="100" width="92" height="22" rx="4" class="a"/>
  <text x="494" y="115" text-anchor="middle" class="acc">QUEUE</text>

  <rect x="558" y="92" width="92" height="22" rx="4" class="a"/>
  <text x="604" y="107" text-anchor="middle" class="acc">VECTORS</text>

  <rect x="640" y="120" width="100" height="22" rx="4" class="a"/>
  <text x="690" y="135" text-anchor="middle" class="acc">SEARCH</text>

  <rect x="448" y="248" width="92" height="22" rx="4" class="a"/>
  <text x="494" y="263" text-anchor="middle" class="acc">PUB-SUB</text>

  <rect x="640" y="248" width="92" height="22" rx="4" class="a"/>
  <text x="686" y="263" text-anchor="middle" class="acc">JSONB</text>

  <!-- connectors from hats to box -->
  <line x1="540" y1="111" x2="560" y2="125" class="a"/>
  <line x1="604" y1="114" x2="604" y2="120" class="a"/>
  <line x1="640" y1="131" x2="620" y2="135" class="a"/>
  <line x1="540" y1="259" x2="560" y2="255" class="a"/>
  <line x1="640" y1="259" x2="620" y2="255" class="a"/>

  <text x="590" y="312" text-anchor="middle" class="label">SPLIT ONE CAPABILITY OUT ONLY WHEN IT ACTUALLY HURTS</text>
</svg>
