<svg viewBox="0 0 800 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-qvp">
  <title id="t-qvp">The same request as POST and as QUERY</title>
  <style>
    .text{fill:#1a1a24;font-family:Inter,system-ui,sans-serif;font-size:12.5px}
    .label{fill:#5c5c66;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:10.5px;letter-spacing:.08em}
    .mono{fill:#1a1a24;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11.5px}
    .acc{fill:#6028d9;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11px}
    .danger{fill:#c14545;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11px}
    .s{stroke:#1a1a24;fill:none;stroke-width:1.25}
    .a{stroke:#6028d9;fill:none;stroke-width:1.5}
    .dg{stroke:#c14545;fill:none;stroke-width:1.25}
    .fs{fill:#f5f1e6}
    @media (prefers-color-scheme: dark){
      .text{fill:#e8e4d8}.label{fill:#9c9ca6}.mono{fill:#e8e4d8}.acc{fill:#b89be8}.danger{fill:#d97a7a}
      .s{stroke:#e8e4d8}.a{stroke:#b89be8}.dg{stroke:#d97a7a}.fs{fill:#1a1a24}
    }
  </style>

  <rect x="0" y="0" width="800" height="340" class="fs"/>
  <text x="40" y="34" class="label">SAME BODY · SAME QUESTION · DIFFERENT VERB</text>

  <!-- POST -->
  <rect x="40" y="58" width="340" height="222" rx="4" class="dg"/>
  <text x="58" y="86" class="danger">POST /products</text>
  <line x1="58" y1="98" x2="362" y2="98" class="dg" stroke-dasharray="4 4"/>
  <text x="58" y="122" class="mono">Content-Type: application/json</text>
  <text x="58" y="146" class="mono">{ "filter": { "price": … } }</text>
  <line x1="58" y1="164" x2="362" y2="164" class="dg" stroke-dasharray="4 4"/>
  <text x="58" y="190" class="danger">✕ unsafe   ✕ non-idempotent</text>
  <text x="58" y="214" class="danger">✕ uncacheable</text>
  <text x="58" y="238" class="text">infra must be TOLD it's a read</text>
  <text x="58" y="266" class="danger">THE PROTOCOL IS LYING</text>

  <!-- QUERY -->
  <rect x="420" y="58" width="340" height="222" rx="4" class="a"/>
  <text x="438" y="86" class="acc">QUERY /products</text>
  <line x1="438" y1="98" x2="742" y2="98" class="a" stroke-dasharray="4 4"/>
  <text x="438" y="122" class="mono">Content-Type: application/json</text>
  <text x="438" y="146" class="mono">{ "filter": { "price": … } }</text>
  <line x1="438" y1="164" x2="742" y2="164" class="a" stroke-dasharray="4 4"/>
  <text x="438" y="190" class="acc">✓ safe   ✓ idempotent</text>
  <text x="438" y="214" class="acc">✓ cacheable</text>
  <text x="438" y="238" class="text">infra KNOWS it's a read</text>
  <text x="438" y="266" class="acc">THE PROTOCOL IS HONEST</text>

  <text x="40" y="324" class="label">THE BODY DOESN'T CHANGE — THE SEMANTICS THE INFRASTRUCTURE SEES DO</text>
</svg>
