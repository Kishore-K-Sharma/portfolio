<svg viewBox="0 0 800 370" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-pilt">
  <title id="t-pilt">The lethal trifecta: all three legs make an agent dangerous</title>
  <style>
    .text{fill:#1a1a24;font-family:Inter,system-ui,sans-serif;font-size:12.5px}
    .label{fill:#5c5c66;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:10.5px;letter-spacing:.08em}
    .mono{fill:#1a1a24;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11px}
    .acc{fill:#6028d9;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11px}
    .danger{fill:#c14545;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11px}
    .s{stroke:#1a1a24;fill:none;stroke-width:1.25}
    .a{stroke:#6028d9;fill:none;stroke-width:1.5}
    .dg{stroke:#c14545;fill:none;stroke-width:1.25}
    .fdgc{fill:#c14545;opacity:0.12}
    .fs{fill:#f5f1e6}
    @media (prefers-color-scheme: dark){
      .text{fill:#e8e4d8}.label{fill:#9c9ca6}.mono{fill:#e8e4d8}.acc{fill:#b89be8}.danger{fill:#d97a7a}
      .s{stroke:#e8e4d8}.a{stroke:#b89be8}.dg{stroke:#d97a7a}.fdgc{fill:#d97a7a;opacity:0.16}.fs{fill:#1a1a24}
    }
  </style>

  <rect x="0" y="0" width="800" height="370" class="fs"/>
  <text x="40" y="34" class="label">THE LETHAL TRIFECTA · DANGER NEEDS ALL THREE LEGS</text>

  <!-- connecting lines to center -->
  <line x1="175" y1="150" x2="400" y2="195" class="dg"/>
  <line x1="625" y1="150" x2="400" y2="195" class="dg"/>
  <line x1="380" y1="286" x2="400" y2="238" class="dg"/>

  <!-- center danger node -->
  <circle cx="400" cy="195" r="46" class="fdgc"/>
  <circle cx="400" cy="195" r="46" class="dg"/>
  <text x="400" y="192" text-anchor="middle" class="danger">DANGER</text>
  <text x="400" y="210" text-anchor="middle" class="text">agent acts</text>

  <!-- leg 1: private data -->
  <rect x="40" y="66" width="270" height="84" rx="4" class="s"/>
  <text x="58" y="90" class="label">LEG 1</text>
  <text x="58" y="114" class="text" style="font-weight:700">PRIVATE DATA</text>
  <text x="58" y="136" class="mono">inbox · files · secrets · tokens</text>

  <!-- leg 2: untrusted content -->
  <rect x="490" y="66" width="270" height="84" rx="4" class="s"/>
  <text x="508" y="90" class="label">LEG 2</text>
  <text x="508" y="114" class="text" style="font-weight:700">UNTRUSTED CONTENT</text>
  <text x="508" y="136" class="mono">email · web · PDF · issue</text>

  <!-- leg 3: exfiltration channel -->
  <rect x="230" y="286" width="300" height="76" rx="4" class="s"/>
  <text x="248" y="308" class="label">LEG 3</text>
  <text x="248" y="330" class="text" style="font-weight:700">EXFILTRATION CHANNEL</text>
  <text x="248" y="352" class="mono">web POST · mail · even an image URL</text>

  <!-- remove-a-leg message -->
  <rect x="560" y="270" width="200" height="90" rx="4" class="a"/>
  <text x="578" y="294" class="acc">REMOVE ANY ONE LEG</text>
  <text x="578" y="318" class="text">and the worst case is</text>
  <text x="578" y="338" class="acc">contained, not</text>
  <text x="578" y="356" class="acc">catastrophic</text>
</svg>
