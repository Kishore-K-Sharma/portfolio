<svg viewBox="0 0 800 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-wvw">
  <title id="t-wvw">WebGL versus WebGPU</title>
  <style>
    .text{fill:#1a1a24;font-family:Inter,system-ui,sans-serif;font-size:12.5px}
    .label{fill:#5c5c66;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:10.5px;letter-spacing:.08em}
    .mono{fill:#1a1a24;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11px}
    .acc{fill:#6028d9;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11px}
    .danger{fill:#c14545;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11px}
    .s{stroke:#1a1a24;fill:none;stroke-width:1.25}
    .a{stroke:#6028d9;fill:none;stroke-width:1.5}
    .dg{stroke:#c14545;fill:none;stroke-width:1.25}
    .fs{fill:#f5f1e6}
    @media (prefers-color-scheme: dark){
      .text{fill:#e8e4d8}.label{fill:#9c9ca6}.mono{fill:#e8e4d8}.acc{fill:#b89be8}.danger{fill:#d97a7a}
      .s{stroke:#e8e4d8}.a{stroke:#b89be8}.dg{stroke:#d97a7a}.fs{fill:#1a1a24}
    }
  </style>

  <rect x="0" y="0" width="800" height="360" class="fs"/>
  <text x="40" y="34" class="label">SAME GPU · TWO WAYS TO TALK TO IT</text>

  <!-- WebGL -->
  <rect x="40" y="58" width="340" height="244" rx="4" class="s"/>
  <text x="58" y="86" class="text" style="font-weight:700">WebGL</text>
  <text x="58" y="104" class="label">OPENGL ES, BOLTED INTO THE BROWSER</text>
  <line x1="58" y1="116" x2="362" y2="116" class="s" stroke-dasharray="4 4"/>
  <text x="58" y="142" class="mono">1990s global state machine</text>
  <text x="58" y="166" class="text">gl.bind… gl.bind… then draw</text>
  <text x="58" y="196" class="danger">✕ graphics only — no compute</text>
  <text x="58" y="220" class="danger">✕ high per-call driver overhead</text>
  <text x="58" y="244" class="danger">✕ hidden global state to fight</text>
  <text x="58" y="282" class="label">A RENDERING API, FULL STOP</text>

  <!-- WebGPU -->
  <rect x="420" y="58" width="340" height="244" rx="4" class="a"/>
  <text x="438" y="86" class="acc" style="font-weight:700">WebGPU</text>
  <text x="438" y="104" class="label">THIN LAYER OVER VULKAN / METAL / D3D12</text>
  <line x1="438" y1="116" x2="742" y2="116" class="a" stroke-dasharray="4 4"/>
  <text x="438" y="142" class="mono">explicit, reusable objects</text>
  <text x="438" y="166" class="text">build the pipeline once, replay it</text>
  <text x="438" y="196" class="acc">✓ graphics AND compute</text>
  <text x="438" y="220" class="acc">✓ low overhead, near-native</text>
  <text x="438" y="244" class="acc">✓ validated up front, no surprises</text>
  <text x="438" y="282" class="acc">A GPU API — RENDER OR CRUNCH</text>

  <text x="40" y="344" class="label">WEBGL DRAWS · WEBGPU DRAWS AND COMPUTES · MAPPED TO HOW GPUS ACTUALLY WORK TODAY</text>
</svg>
