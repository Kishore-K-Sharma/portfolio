<svg viewBox="0 0 800 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-mtax">
  <title id="t-mtax">A taxonomy of agent memory</title>
  <style>
    .text{fill:#1a1a24;font-family:Inter,system-ui,sans-serif;font-size:12.5px}
    .label{fill:#5c5c66;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:10.5px;letter-spacing:.08em}
    .mono{fill:#1a1a24;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11px}
    .acc{fill:#6028d9;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11px}
    .s{stroke:#1a1a24;fill:none;stroke-width:1.25}
    .a{stroke:#6028d9;fill:none;stroke-width:1.5}
    .fs{fill:#f5f1e6}
    @media (prefers-color-scheme: dark){
      .text{fill:#e8e4d8}.label{fill:#9c9ca6}.mono{fill:#e8e4d8}.acc{fill:#b89be8}
      .s{stroke:#e8e4d8}.a{stroke:#b89be8}.fs{fill:#1a1a24}
    }
  </style>

  <rect x="0" y="0" width="800" height="360" class="fs"/>
  <text x="40" y="34" class="label">TWO KINDS OF MEMORY · SHORT-TERM VS LONG-TERM</text>

  <!-- short-term -->
  <rect x="40" y="60" width="230" height="252" rx="4" class="s"/>
  <text x="58" y="88" class="text" style="font-weight:700">SHORT-TERM</text>
  <text x="58" y="106" class="label">WORKING MEMORY · IN CONTEXT</text>
  <line x1="58" y1="118" x2="252" y2="118" class="s" stroke-dasharray="4 4"/>
  <text x="58" y="146" class="mono">the live conversation</text>
  <text x="58" y="176" class="text">· sliding window</text>
  <text x="58" y="200" class="text">· truncation</text>
  <text x="58" y="224" class="text">· compaction</text>
  <text x="58" y="286" class="label">SUMMARIZE OLD TURNS TO SURVIVE</text>

  <!-- long-term header -->
  <text x="300" y="88" class="acc" style="font-weight:700">LONG-TERM</text>
  <text x="300" y="106" class="label">PERSISTED · SPLIT THREE WAYS</text>

  <!-- episodic -->
  <rect x="300" y="120" width="460" height="58" rx="4" class="a"/>
  <text x="318" y="144" class="acc">EPISODIC</text>
  <text x="318" y="166" class="text">what happened — past sessions, decisions, outcomes</text>

  <!-- semantic -->
  <rect x="300" y="186" width="460" height="58" rx="4" class="a"/>
  <text x="318" y="210" class="acc">SEMANTIC</text>
  <text x="318" y="232" class="text">extracted facts — "stack is Spring Boot", "deploys Friday"</text>

  <!-- procedural -->
  <rect x="300" y="252" width="460" height="58" rx="4" class="a"/>
  <text x="318" y="276" class="acc">PROCEDURAL</text>
  <text x="318" y="298" class="text">learned how-tos &amp; prefs — "run tests before done"</text>
</svg>
