<svg viewBox="0 0 800 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-llm-wf">
  <title id="t-llm-wf">One agent request as a waterfall — model calls, a slow tool, and a retrieval span, with tokens and time on each</title>
  <style>
    .text{fill:#1a1a24;font-family:Inter,system-ui,sans-serif;font-size:13px}
    .label{fill:#5c5c66;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:10.5px;letter-spacing:.08em}
    .mono{fill:#1a1a24;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11.5px}
    .acc{fill:#6028d9;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11px}
    .danger{fill:#c14545;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:10.5px;letter-spacing:.08em}
    .s{stroke:#1a1a24;fill:none;stroke-width:1.25}
    .sm{stroke:#b3b3bd;fill:none;stroke-width:1;stroke-dasharray:4 4}
    .a{stroke:#6028d9;fill:none;stroke-width:1.5}
    .dg{stroke:#c14545;fill:none;stroke-width:1.25}
    .fa{fill:#6028d9}
    .fd{fill:#c14545}
    .fs{fill:#f5f1e6}
    @media (prefers-color-scheme: dark){
      .text{fill:#e8e4d8}.label{fill:#9c9ca6}.mono{fill:#e8e4d8}.acc{fill:#b89be8}.danger{fill:#d97a7a}
      .s{stroke:#e8e4d8}.sm{stroke:#4a4a55}.a{stroke:#b89be8}.dg{stroke:#d97a7a}
      .fa{fill:#b89be8}.fd{fill:#d97a7a}.fs{fill:#1a1a24}
    }
  </style>

  <rect x="0" y="0" width="800" height="360" class="fs"/>
  <text x="40" y="34" class="label">ONE AGENT REQUEST · trace_id 9ac1f0 · TOTAL 8.4s · 3,910 TOKENS</text>

  <!-- time axis -->
  <line x1="300" y1="56" x2="760" y2="56" class="sm"/>
  <text x="300" y="50" class="label">0s</text>
  <text x="530" y="50" text-anchor="middle" class="label">4s</text>
  <text x="760" y="50" text-anchor="end" class="label">8.4s</text>

  <!-- Row 1: root, user request -->
  <text x="40" y="84" class="mono">agent</text>
  <text x="40" y="99" class="label">SPAN · user request</text>
  <rect x="300" y="72" width="455" height="20" rx="4" class="s"/>
  <text x="310" y="86" class="mono">8.40s</text>

  <!-- Row 2: llm.call #1 -->
  <text x="64" y="124" class="mono">llm.call</text>
  <text x="64" y="139" class="label">gpt · in 820 / out 90</text>
  <rect x="305" y="112" width="70" height="20" rx="4" class="a"/>
  <text x="315" y="126" class="acc">0.9s</text>

  <!-- Row 3: retrieval.search -->
  <text x="64" y="164" class="mono">retrieval.search</text>
  <text x="64" y="179" class="label">vector · top_k 8</text>
  <rect x="380" y="152" width="45" height="20" rx="4" class="s"/>
  <text x="390" y="166" class="mono">0.4s</text>

  <!-- Row 4: tool.execute (slow, danger) -->
  <text x="64" y="204" class="danger">tool.execute</text>
  <text x="64" y="219" class="danger">db_lookup · args {…}</text>
  <rect x="430" y="192" width="215" height="20" rx="4" class="fs"/>
  <rect x="430" y="192" width="215" height="20" rx="4" class="dg"/>
  <text x="440" y="206" class="danger">6.0s · THE SLOW ONE</text>

  <!-- Row 5: llm.call #2 -->
  <text x="64" y="244" class="mono">llm.call</text>
  <text x="64" y="259" class="label">gpt · in 2,800 / out 200</text>
  <rect x="650" y="232" width="105" height="20" rx="4" class="a"/>
  <text x="660" y="246" class="acc">1.1s · big prompt</text>

  <!-- callout -->
  <line x1="537" y1="212" x2="537" y2="284" class="dg"/>
  <polygon points="537,284 532,274 542,274" class="fd"/>
  <text x="400" y="306" text-anchor="middle" class="danger">"THE AGENT WAS SLOW" IS REALLY "ONE TOOL TOOK 6s AND FORCED A SECOND MODEL ROUND-TRIP"</text>

  <line x1="40" y1="326" x2="760" y2="326" class="sm"/>
  <text x="40" y="348" class="label">EVERY MODEL CALL · TOOL · RETRIEVAL IS A SPAN · BAR = TIME · ATTRS = TOKENS SPENT</text>
</svg>
