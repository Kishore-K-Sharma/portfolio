<svg viewBox="0 0 800 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-evoo">
  <title id="t-evoo">Two eval loops: offline gate before ship, online monitoring, and the flywheel between them</title>
  <style>
    .text{fill:#1a1a24;font-family:Inter,system-ui,sans-serif;font-size:12.5px}
    .label{fill:#5c5c66;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:10.5px;letter-spacing:.08em}
    .mono{fill:#1a1a24;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11px}
    .acc{fill:#6028d9;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11px}
    .danger{fill:#c14545;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11px}
    .s{stroke:#1a1a24;fill:none;stroke-width:1.25}
    .a{stroke:#6028d9;fill:none;stroke-width:1.5}
    .dg{stroke:#c14545;fill:none;stroke-width:1.25}
    .fa{fill:#6028d9}
    .fs{fill:#f5f1e6}
    @media (prefers-color-scheme: dark){
      .text{fill:#e8e4d8}.label{fill:#9c9ca6}.mono{fill:#e8e4d8}.acc{fill:#b89be8}.danger{fill:#d97a7a}
      .s{stroke:#e8e4d8}.a{stroke:#b89be8}.dg{stroke:#d97a7a}.fa{fill:#b89be8}.fs{fill:#1a1a24}
    }
  </style>

  <rect x="0" y="0" width="800" height="360" class="fs"/>
  <text x="40" y="28" class="label">OFFLINE · CI GATE BEFORE YOU SHIP</text>

  <!-- Offline row -->
  <rect x="40" y="42" width="150" height="70" rx="4" class="s"/>
  <text x="115" y="66" text-anchor="middle" class="acc">EVAL SET</text>
  <text x="115" y="86" text-anchor="middle" class="text">golden dataset,</text>
  <text x="115" y="104" text-anchor="middle" class="text">versioned</text>

  <rect x="230" y="42" width="150" height="70" rx="4" class="s"/>
  <text x="305" y="66" text-anchor="middle" class="acc">RUN CANDIDATE</text>
  <text x="305" y="86" text-anchor="middle" class="text">new prompt or</text>
  <text x="305" y="104" text-anchor="middle" class="text">model version</text>

  <rect x="420" y="42" width="150" height="70" rx="4" class="s"/>
  <text x="495" y="66" text-anchor="middle" class="acc">SCORE</text>
  <text x="495" y="86" text-anchor="middle" class="text">pass-rate /</text>
  <text x="495" y="104" text-anchor="middle" class="text">win-rate</text>

  <rect x="610" y="42" width="150" height="70" rx="4" class="fs"/>
  <rect x="610" y="42" width="150" height="70" rx="4" class="a"/>
  <text x="685" y="66" text-anchor="middle" class="acc">GATE</text>
  <text x="685" y="86" text-anchor="middle" class="text">ship if it holds,</text>
  <text x="685" y="104" text-anchor="middle" class="danger">block if it drops</text>

  <line x1="190" y1="77" x2="228" y2="77" class="a"/>
  <polygon points="228,77 218,72 218,82" class="fa"/>
  <line x1="380" y1="77" x2="418" y2="77" class="a"/>
  <polygon points="418,77 408,72 408,82" class="fa"/>
  <line x1="570" y1="77" x2="608" y2="77" class="a"/>
  <polygon points="608,77 598,72 598,82" class="fa"/>

  <!-- Divider -->
  <line x1="40" y1="140" x2="760" y2="140" class="s" stroke-dasharray="4 4"/>

  <text x="40" y="168" class="label">ONLINE · PROD MONITORING</text>

  <!-- Online row -->
  <rect x="40" y="182" width="150" height="70" rx="4" class="s"/>
  <text x="115" y="206" text-anchor="middle" class="text" style="font-weight:700">PROD TRAFFIC</text>
  <text x="115" y="228" text-anchor="middle" class="mono">real requests</text>

  <rect x="230" y="182" width="150" height="70" rx="4" class="s"/>
  <text x="305" y="206" text-anchor="middle" class="text" style="font-weight:700">SAMPLE</text>
  <text x="305" y="228" text-anchor="middle" class="text">a slice of live</text>
  <text x="305" y="246" text-anchor="middle" class="text">interactions</text>

  <rect x="420" y="182" width="150" height="70" rx="4" class="s"/>
  <text x="495" y="206" text-anchor="middle" class="text" style="font-weight:700">JUDGE + GUARDRAILS</text>
  <text x="495" y="228" text-anchor="middle" class="text">score live,</text>
  <text x="495" y="246" text-anchor="middle" class="text">watch for drift</text>

  <rect x="610" y="182" width="150" height="70" rx="4" class="dg"/>
  <text x="685" y="206" text-anchor="middle" class="danger">FAILURES</text>
  <text x="685" y="228" text-anchor="middle" class="text">thumbs-down,</text>
  <text x="685" y="246" text-anchor="middle" class="text">bad outputs</text>

  <line x1="190" y1="217" x2="228" y2="217" class="s"/>
  <polygon points="228,217 218,212 218,222" class="fs" stroke="none"/>
  <line x1="380" y1="217" x2="418" y2="217" class="s"/>
  <line x1="570" y1="217" x2="608" y2="217" class="s"/>

  <!-- Flywheel: failures back into eval set, up the left margin -->
  <path d="M 685 252 L 685 300 L 20 300 L 20 77 L 38 77" class="a"/>
  <polygon points="38,77 28,72 28,82" class="fa"/>
  <text x="400" y="330" text-anchor="middle" class="label">DATA FLYWHEEL · REAL FAILURES BECOME NEW EVAL CASES · THE TWO LOOPS FEED EACH OTHER</text>
</svg>
