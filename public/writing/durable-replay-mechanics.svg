<svg viewBox="0 0 800 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-drm">
  <title id="t-drm">How replay works: journaled steps return recorded results instantly and execution resumes at the first un-journaled line</title>
  <style>
    .text{fill:#1a1a24;font-family:Inter,system-ui,sans-serif;font-size:12.5px}
    .label{fill:#5c5c66;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:10.5px;letter-spacing:.08em}
    .mono{fill:#1a1a24;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11px}
    .acc{fill:#6028d9;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11px}
    .danger{fill:#c14545;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11px}
    .s{stroke:#1a1a24;fill:none;stroke-width:1.25}
    .a{stroke:#6028d9;fill:none;stroke-width:1.5}
    .dg{stroke:#c14545;fill:none;stroke-width:1.25}
    .fs{fill:#f5f1e6}
    @media (prefers-color-scheme: dark){
      .text{fill:#e8e4d8}.label{fill:#9c9ca6}.mono{fill:#e8e4d8}.acc{fill:#b89be8}.danger{fill:#d97a7a}
      .s{stroke:#e8e4d8}.a{stroke:#b89be8}.dg{stroke:#d97a7a}.fs{fill:#1a1a24}
    }
  </style>

  <rect x="0" y="0" width="800" height="360" class="fs"/>
  <text x="40" y="34" class="label">CRASH → RESTART → RUN THE FUNCTION AGAIN FROM THE TOP</text>

  <!-- workflow code -->
  <rect x="40" y="56" width="330" height="230" rx="4" class="s"/>
  <text x="58" y="84" class="mono">orderWorkflow()</text>
  <line x1="58" y1="96" x2="352" y2="96" class="s" stroke-dasharray="4 4"/>
  <text x="58" y="124" class="mono">await charge()</text>
  <text x="240" y="124" class="acc">◂ replayed</text>
  <text x="58" y="152" class="mono">await reserve()</text>
  <text x="240" y="152" class="acc">◂ replayed</text>
  <text x="58" y="180" class="mono">await ship()</text>
  <text x="240" y="180" class="acc">◂ replayed</text>
  <text x="58" y="212" class="acc" style="font-weight:700">await email()</text>
  <text x="58" y="236" class="acc">▲ RESUMES HERE — first line</text>
  <text x="58" y="254" class="acc">  the journal has never seen</text>
  <text x="58" y="276" class="text">locals rebuilt · same values as before</text>

  <!-- event history -->
  <rect x="430" y="56" width="330" height="150" rx="4" class="a"/>
  <text x="448" y="84" class="acc">EVENT HISTORY · APPEND-ONLY</text>
  <line x1="448" y1="96" x2="742" y2="96" class="a" stroke-dasharray="4 4"/>
  <text x="448" y="122" class="mono">1  charge()  → pay_123</text>
  <text x="448" y="146" class="mono">2  reserve() → hold_88</text>
  <text x="448" y="170" class="mono">3  ship()    → shp_407</text>
  <text x="448" y="194" class="text">each result recorded before moving on</text>

  <!-- replay arrow -->
  <line x1="430" y1="131" x2="374" y2="152" class="a"/>
  <text x="402" y="120" text-anchor="middle" class="acc">replay</text>
  <text x="400" y="230" class="text">recorded results return instantly —</text>
  <text x="400" y="248" class="text">no re-charge, no second reservation</text>

  <!-- determinism note -->
  <rect x="430" y="264" width="330" height="60" rx="4" class="dg"/>
  <text x="448" y="288" class="danger">THE CONTRACT: DETERMINISM</text>
  <text x="448" y="310" class="text">no new Date(), no random, no IO here</text>

  <text x="40" y="352" class="label">JOURNALED STEPS FAST-FORWARD · REAL EXECUTION RESUMES AT STEP 4</text>
</svg>
