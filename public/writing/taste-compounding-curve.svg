<svg viewBox="0 0 800 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-taste-curve">
  <title id="t-taste-curve">How taste compounds against raw coding speed over a career</title>
  <style>
    .text{fill:#1a1a24;font-family:Inter,system-ui,sans-serif;font-size:13px}
    .label{fill:#5c5c66;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:10.5px;letter-spacing:.08em}
    .mono{fill:#1a1a24;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11.5px}
    .acc{fill:#6028d9;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11px}
    .danger{fill:#c14545;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:10.5px;letter-spacing:.08em}
    .s{stroke:#1a1a24;fill:none;stroke-width:1.25}
    .sm{stroke:#b3b3bd;fill:none;stroke-width:1;stroke-dasharray:4 4}
    .a{stroke:#6028d9;fill:none;stroke-width:2.5}
    .dg{stroke:#c14545;fill:none;stroke-width:2.5;stroke-dasharray:6 4}
    .fa{fill:#6028d9}
    .fd{fill:#c14545}
    @media (prefers-color-scheme: dark){
      .text{fill:#e8e4d8}.label{fill:#9c9ca6}.mono{fill:#e8e4d8}.acc{fill:#b89be8}.danger{fill:#d97a7a}
      .s{stroke:#e8e4d8}.sm{stroke:#4a4a55}.a{stroke:#b89be8}.dg{stroke:#d97a7a}
      .fa{fill:#b89be8}.fd{fill:#d97a7a}
    }
  </style>

  <text x="40" y="36" class="label">CAREER VALUE OVER TIME · TASTE COMPOUNDS · CODING SPEED PLATEAUS</text>

  <!-- Axes -->
  <line x1="80" y1="80" x2="80" y2="290" class="s"/>
  <line x1="80" y1="290" x2="740" y2="290" class="s"/>

  <text x="60" y="86" text-anchor="end" class="label">HIGH</text>
  <text x="60" y="290" text-anchor="end" class="label">0</text>
  <text x="35" y="190" text-anchor="middle" class="label" transform="rotate(-90,35,190)">VALUE TO TEAM</text>

  <text x="120" y="310" text-anchor="middle" class="label">YEAR 1</text>
  <text x="280" y="310" text-anchor="middle" class="label">YEAR 3</text>
  <text x="440" y="310" text-anchor="middle" class="label">YEAR 5</text>
  <text x="600" y="310" text-anchor="middle" class="label">YEAR 10</text>
  <text x="730" y="310" text-anchor="middle" class="label">YEAR 15+</text>

  <!-- Gridlines -->
  <line x1="80" y1="220" x2="740" y2="220" class="sm"/>
  <line x1="80" y1="150" x2="740" y2="150" class="sm"/>
  <line x1="80" y1="100" x2="740" y2="100" class="sm"/>

  <!-- Coding-speed curve (dashed red): rises fast, plateaus low -->
  <path d="M 120 270 Q 250 200, 380 195 T 730 200" class="dg"/>
  <circle cx="730" cy="200" r="3" class="fd"/>
  <text x="600" y="225" class="danger">CODING SPEED (PLATEAUS · COMMODITISED BY AI)</text>

  <!-- Taste curve (solid purple): slow start, exponential -->
  <path d="M 120 275 Q 280 260, 440 180 T 730 90" class="a"/>
  <circle cx="730" cy="90" r="3" class="fa"/>
  <text x="500" y="118" class="acc">TASTE (COMPOUNDS · DURABLE · YOURS)</text>

  <text x="120" y="265" class="label">JUNIOR</text>
  <text x="280" y="245" class="label">MID</text>
  <text x="440" y="170" class="label">SENIOR</text>
  <text x="600" y="125" class="label">STAFF</text>
  <text x="700" y="80" class="label">PRINCIPAL</text>

  <text x="400" y="348" text-anchor="middle" class="label">CODING SPEED IS NOW A TWO-YEAR ASSET · TASTE IS A TWENTY-YEAR ONE</text>
</svg>
