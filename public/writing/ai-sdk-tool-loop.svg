<svg viewBox="0 0 800 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-loop">
  <title id="t-loop">The agentic tool-calling loop</title>
  <style>
    .text{fill:#1a1a24;font-family:Inter,system-ui,sans-serif;font-size:12.5px}
    .label{fill:#5c5c66;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:10.5px;letter-spacing:.08em}
    .mono{fill:#1a1a24;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11px}
    .acc{fill:#6028d9;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11px}
    .s{stroke:#1a1a24;fill:none;stroke-width:1.25}
    .a{stroke:#6028d9;fill:none;stroke-width:1.5}
    .fs{fill:#f5f1e6}
    @media (prefers-color-scheme: dark){
      .text{fill:#e8e4d8}.label{fill:#9c9ca6}.mono{fill:#e8e4d8}.acc{fill:#b89be8}
      .s{stroke:#e8e4d8}.a{stroke:#b89be8}.fs{fill:#1a1a24}
    }
  </style>

  <rect x="0" y="0" width="800" height="360" class="fs"/>
  <text x="40" y="34" class="label">THE AGENTIC LOOP · THE SDK DRIVES IT FOR YOU</text>

  <!-- prompt -->
  <rect x="40" y="158" width="130" height="60" rx="4" class="s"/>
  <text x="105" y="193" text-anchor="middle" class="text" style="font-weight:700">PROMPT</text>

  <!-- prompt -> model -->
  <line x1="170" y1="188" x2="296" y2="135" class="s"/>

  <!-- model -->
  <rect x="300" y="90" width="190" height="72" rx="4" class="a"/>
  <text x="395" y="122" text-anchor="middle" class="acc">MODEL</text>
  <text x="395" y="143" text-anchor="middle" class="text">requests a tool</text>

  <!-- sdk runs tool -->
  <rect x="300" y="230" width="190" height="72" rx="4" class="a"/>
  <text x="395" y="262" text-anchor="middle" class="acc">SDK RUNS TOOL</text>
  <text x="395" y="283" text-anchor="middle" class="text">your execute() fn</text>

  <!-- loop down: model -> tool -->
  <line x1="345" y1="162" x2="345" y2="228" class="a"/>
  <text x="336" y="200" text-anchor="end" class="acc">calls</text>

  <!-- loop up: tool -> model (result fed back) -->
  <line x1="445" y1="230" x2="445" y2="164" class="a"/>
  <text x="454" y="200" class="acc">result back</text>

  <!-- model -> final answer -->
  <line x1="490" y1="126" x2="616" y2="182" class="s"/>
  <text x="553" y="140" text-anchor="middle" class="text">done</text>

  <!-- final answer -->
  <rect x="620" y="158" width="140" height="60" rx="4" class="s"/>
  <text x="690" y="193" text-anchor="middle" class="text" style="font-weight:700">FINAL ANSWER</text>

  <text x="40" y="344" class="label">MODEL ASKS · SDK RUNS · RESULT FEEDS BACK · REPEAT UNTIL A FINAL ANSWER</text>
</svg>
