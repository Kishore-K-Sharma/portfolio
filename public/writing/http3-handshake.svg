<svg viewBox="0 0 800 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-hs">
  <title id="t-hs">Handshake round trips: TCP+TLS versus QUIC</title>
  <style>
    .text{fill:#1a1a24;font-family:Inter,system-ui,sans-serif;font-size:12.5px}
    .label{fill:#5c5c66;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:10.5px;letter-spacing:.08em}
    .mono{fill:#1a1a24;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11px}
    .acc{fill:#6028d9;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11px}
    .danger{fill:#c14545;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11px}
    .s{stroke:#1a1a24;fill:none;stroke-width:1.25}
    .a{stroke:#6028d9;fill:none;stroke-width:1.5}
    .dg{stroke:#c14545;fill:none;stroke-width:1.25}
    .fs{fill:#f5f1e6}
    @media (prefers-color-scheme: dark){
      .text{fill:#e8e4d8}.label{fill:#9c9ca6}.mono{fill:#e8e4d8}.acc{fill:#b89be8}.danger{fill:#d97a7a}
      .s{stroke:#e8e4d8}.a{stroke:#b89be8}.dg{stroke:#d97a7a}.fs{fill:#1a1a24}
    }
  </style>

  <rect x="0" y="0" width="800" height="360" class="fs"/>
  <text x="40" y="34" class="label">ROUND TRIPS BEFORE THE FIRST BYTE OF DATA</text>

  <!-- client / server rails -->
  <text x="70" y="70" class="label">CLIENT</text>
  <text x="360" y="70" text-anchor="end" class="label">SERVER</text>
  <text x="440" y="70" class="label">CLIENT</text>
  <text x="760" y="70" text-anchor="end" class="label">SERVER</text>

  <!-- HTTP/2 side: TCP then TLS -->
  <text x="70" y="98" class="danger" style="font-weight:700">HTTP/2 · TCP then TLS</text>
  <line x1="70" y1="112" x2="360" y2="112" class="dg" stroke-dasharray="3 4"/>
  <line x1="70" y1="130" x2="356" y2="150" class="dg"/>
  <text x="74" y="126" class="mono">SYN →</text>
  <line x1="356" y1="158" x2="74" y2="178" class="dg"/>
  <text x="356" y="172" text-anchor="end" class="mono">← SYN-ACK</text>
  <text x="74" y="196" class="danger">RTT 1 · TCP up</text>
  <line x1="74" y1="206" x2="356" y2="226" class="dg"/>
  <text x="74" y="222" class="mono">TLS hello →</text>
  <line x1="356" y1="234" x2="74" y2="254" class="dg"/>
  <text x="356" y="248" text-anchor="end" class="mono">← keys</text>
  <text x="74" y="272" class="danger">RTT 2 · TLS up</text>
  <text x="74" y="300" class="mono">→ DATA (after 2–3 RTT)</text>

  <!-- HTTP/3 side: combined -->
  <text x="440" y="98" class="acc" style="font-weight:700">HTTP/3 · QUIC combined</text>
  <line x1="440" y1="112" x2="760" y2="112" class="a" stroke-dasharray="3 4"/>
  <line x1="444" y1="130" x2="756" y2="150" class="a"/>
  <text x="444" y="126" class="mono">QUIC + TLS 1.3 hello →</text>
  <line x1="756" y1="158" x2="444" y2="178" class="a"/>
  <text x="756" y="172" text-anchor="end" class="mono">← keys + ready</text>
  <text x="444" y="196" class="acc">RTT 1 · transport + crypto up</text>
  <text x="444" y="222" class="mono">→ DATA (after 1 RTT)</text>
  <rect x="444" y="240" width="312" height="46" rx="4" class="a"/>
  <text x="452" y="262" class="acc">RESUMED: 0-RTT</text>
  <text x="452" y="280" class="mono">→ DATA in the very first packet</text>

  <text x="40" y="344" class="label">TCP+TLS = MULTIPLE RTT · QUIC = 1-RTT · RESUME = 0-RTT</text>
</svg>
