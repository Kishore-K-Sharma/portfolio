<svg viewBox="0 0 800 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-saga-comp">
  <title id="t-saga-comp">A saga's happy path runs order, payment, inventory, shipping forward; when inventory fails, compensating transactions run in reverse to release the hold and refund the payment</title>
  <style>
    .text{fill:#1a1a24;font-family:Inter,system-ui,sans-serif;font-size:13px}
    .label{fill:#5c5c66;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:10.5px;letter-spacing:.08em}
    .mono{fill:#1a1a24;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11.5px}
    .acc{fill:#6028d9;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11px}
    .danger{fill:#c14545;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:10.5px;letter-spacing:.08em}
    .s{stroke:#1a1a24;fill:none;stroke-width:1.25}
    .sm{stroke:#b3b3bd;fill:none;stroke-width:1;stroke-dasharray:4 4}
    .a{stroke:#6028d9;fill:none;stroke-width:1.5}
    .dg{stroke:#c14545;fill:none;stroke-width:1.25}
    .fa{fill:#6028d9}
    .fd{fill:#c14545}
    .fs{fill:#f5f1e6}
    @media (prefers-color-scheme: dark){
      .text{fill:#e8e4d8}.label{fill:#9c9ca6}.mono{fill:#e8e4d8}.acc{fill:#b89be8}.danger{fill:#d97a7a}
      .s{stroke:#e8e4d8}.sm{stroke:#4a4a55}.a{stroke:#b89be8}.dg{stroke:#d97a7a}
      .fa{fill:#b89be8}.fd{fill:#d97a7a}.fs{fill:#1a1a24}
    }
  </style>

  <!-- ===== HAPPY PATH ===== -->
  <text x="40" y="34" class="label">HAPPY PATH · FORWARD · EACH STEP IS ITS OWN LOCAL COMMIT</text>

  <!-- Order -->
  <rect x="40" y="56" width="150" height="58" rx="4" class="s"/>
  <text x="115" y="82" text-anchor="middle" class="acc">ORDER</text>
  <text x="115" y="100" text-anchor="middle" class="text">create pending</text>

  <line x1="190" y1="85" x2="225" y2="85" class="a"/>
  <polygon points="230,85 220,80 220,90" class="fa"/>

  <!-- Payment -->
  <rect x="230" y="56" width="150" height="58" rx="4" class="s"/>
  <text x="305" y="82" text-anchor="middle" class="acc">PAYMENT</text>
  <text x="305" y="100" text-anchor="middle" class="text">charge card</text>

  <line x1="380" y1="85" x2="415" y2="85" class="a"/>
  <polygon points="420,85 410,80 410,90" class="fa"/>

  <!-- Inventory -->
  <rect x="420" y="56" width="150" height="58" rx="4" class="s"/>
  <text x="495" y="82" text-anchor="middle" class="acc">INVENTORY</text>
  <text x="495" y="100" text-anchor="middle" class="text">reserve hold</text>

  <line x1="570" y1="85" x2="605" y2="85" class="a"/>
  <polygon points="610,85 600,80 600,90" class="fa"/>

  <!-- Shipping -->
  <rect x="610" y="56" width="150" height="58" rx="4" class="s"/>
  <text x="685" y="82" text-anchor="middle" class="acc">SHIPPING</text>
  <text x="685" y="100" text-anchor="middle" class="text">schedule</text>

  <!-- divider -->
  <line x1="40" y1="150" x2="760" y2="150" class="sm"/>

  <!-- ===== FAILURE PATH ===== -->
  <text x="40" y="178" class="danger">INVENTORY OUT OF STOCK · COMPENSATE IN REVERSE · STEPS N-1 ... 1</text>

  <!-- Order (compensated) -->
  <rect x="40" y="200" width="150" height="64" rx="4" class="dg"/>
  <text x="115" y="226" text-anchor="middle" class="danger">ORDER</text>
  <text x="115" y="245" text-anchor="middle" class="text">mark CANCELLED</text>
  <text x="115" y="259" text-anchor="middle" class="label">COMPENSATE 1</text>

  <!-- Payment (compensated) -->
  <rect x="230" y="200" width="150" height="64" rx="4" class="dg"/>
  <text x="305" y="226" text-anchor="middle" class="danger">PAYMENT</text>
  <text x="305" y="245" text-anchor="middle" class="text">REFUND charge</text>
  <text x="305" y="259" text-anchor="middle" class="label">COMPENSATE 2</text>

  <!-- Inventory (the failure) -->
  <rect x="420" y="200" width="150" height="64" rx="4" class="fs"/>
  <rect x="420" y="200" width="150" height="64" rx="4" class="dg"/>
  <text x="495" y="226" text-anchor="middle" class="danger">INVENTORY</text>
  <text x="495" y="245" text-anchor="middle" class="danger">FAILS — NO STOCK</text>
  <text x="495" y="259" text-anchor="middle" class="label">PIVOT · NOTHING TO UNDO</text>

  <!-- Shipping (never ran) -->
  <rect x="610" y="200" width="150" height="64" rx="4" class="sm"/>
  <text x="685" y="226" text-anchor="middle" class="label">SHIPPING</text>
  <text x="685" y="248" text-anchor="middle" class="label">NEVER STARTED</text>

  <!-- reverse arrows: inventory -> payment -> order -->
  <line x1="420" y1="232" x2="385" y2="232" class="dg"/>
  <polygon points="380,232 390,227 390,237" class="fd"/>
  <line x1="230" y1="232" x2="195" y2="232" class="dg"/>
  <polygon points="190,232 200,227 200,237" class="fd"/>

  <text x="400" y="316" text-anchor="middle" class="text">the refund is a NEW transaction that does the opposite —</text>
  <text x="400" y="334" text-anchor="middle" class="text">there is no global ROLLBACK to call</text>
</svg>
