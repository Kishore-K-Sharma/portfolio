<svg viewBox="0 0 800 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-stack">
  <title id="t-stack">HTTP/2 stack versus HTTP/3 stack</title>
  <style>
    .text{fill:#1a1a24;font-family:Inter,system-ui,sans-serif;font-size:12.5px}
    .label{fill:#5c5c66;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:10.5px;letter-spacing:.08em}
    .acc{fill:#6028d9;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11px}
    .danger{fill:#c14545;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11px}
    .s{stroke:#1a1a24;fill:none;stroke-width:1.25}
    .a{stroke:#6028d9;fill:none;stroke-width:1.5}
    .dg{stroke:#c14545;fill:none;stroke-width:1.25}
    .fs{fill:#f5f1e6}
    @media (prefers-color-scheme: dark){
      .text{fill:#e8e4d8}.label{fill:#9c9ca6}.acc{fill:#b89be8}.danger{fill:#d97a7a}
      .s{stroke:#e8e4d8}.a{stroke:#b89be8}.dg{stroke:#d97a7a}.fs{fill:#1a1a24}
    }
  </style>

  <rect x="0" y="0" width="800" height="360" class="fs"/>
  <text x="40" y="34" class="label">SAME HTTP · DIFFERENT TRANSPORT UNDERNEATH</text>

  <!-- HTTP/2 stack -->
  <text x="58" y="72" class="text" style="font-weight:700">HTTP/2</text>
  <rect x="58" y="86" width="300" height="42" rx="4" class="s"/>
  <text x="208" y="112" text-anchor="middle" class="text">HTTP/2</text>
  <rect x="58" y="136" width="300" height="42" rx="4" class="s"/>
  <text x="208" y="162" text-anchor="middle" class="text">TLS</text>
  <rect x="58" y="186" width="300" height="42" rx="4" class="dg"/>
  <text x="208" y="212" text-anchor="middle" class="danger">TCP</text>
  <rect x="58" y="236" width="300" height="42" rx="4" class="s"/>
  <text x="208" y="262" text-anchor="middle" class="text">IP</text>
  <text x="58" y="304" class="danger">4 LAYERS · EACH NEGOTIATED APART</text>

  <!-- HTTP/3 stack -->
  <text x="458" y="72" class="acc" style="font-weight:700">HTTP/3</text>
  <rect x="458" y="86" width="300" height="42" rx="4" class="a"/>
  <text x="608" y="112" text-anchor="middle" class="acc">HTTP/3</text>
  <rect x="458" y="136" width="300" height="92" rx="4" class="a"/>
  <text x="608" y="168" text-anchor="middle" class="acc">QUIC</text>
  <text x="608" y="192" text-anchor="middle" class="text">reliability · streams · congestion</text>
  <text x="608" y="212" text-anchor="middle" class="acc">+ TLS 1.3 inside</text>
  <rect x="458" y="236" width="300" height="42" rx="4" class="s"/>
  <text x="608" y="262" text-anchor="middle" class="text">UDP · IP</text>
  <text x="458" y="304" class="acc">TLS LIVES INSIDE QUIC · RIDES UDP</text>

  <text x="40" y="344" class="label">HTTP/2 STACKS TLS ON TCP · HTTP/3 FOLDS TRANSPORT + TLS INTO QUIC</text>
</svg>
