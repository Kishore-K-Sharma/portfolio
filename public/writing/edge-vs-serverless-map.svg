<svg viewBox="0 0 800 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-map">
  <title id="t-map">Where edge and serverless code runs relative to the user</title>
  <style>
    .text{fill:#1a1a24;font-family:Inter,system-ui,sans-serif;font-size:12.5px}
    .label{fill:#5c5c66;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:10.5px;letter-spacing:.08em}
    .acc{fill:#6028d9;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11px}
    .danger{fill:#c14545;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11px}
    .s{stroke:#1a1a24;fill:none;stroke-width:1.25}
    .a{stroke:#6028d9;fill:none;stroke-width:1.5}
    .dg{stroke:#c14545;fill:none;stroke-width:1.25}
    .fs{fill:#f5f1e6}
    @media (prefers-color-scheme: dark){
      .text{fill:#e8e4d8}.label{fill:#9c9ca6}.acc{fill:#b89be8}.danger{fill:#d97a7a}
      .s{stroke:#e8e4d8}.a{stroke:#b89be8}.dg{stroke:#d97a7a}.fs{fill:#1a1a24}
    }
  </style>

  <rect x="0" y="0" width="800" height="360" class="fs"/>
  <text x="40" y="34" class="label">WHERE YOUR CODE RUNS RELATIVE TO THE USER</text>

  <!-- EDGE row -->
  <text x="40" y="72" class="acc">EDGE · MANY POPS, EACH NEXT TO A USER</text>
  <!-- 4 pop+user columns -->
  <rect x="88" y="86" width="84" height="30" rx="4" class="a"/>
  <text x="130" y="105" text-anchor="middle" class="acc">POP</text>
  <line x1="130" y1="116" x2="130" y2="138" class="a"/>
  <circle cx="130" cy="150" r="8" class="s"/>

  <rect x="258" y="86" width="84" height="30" rx="4" class="a"/>
  <text x="300" y="105" text-anchor="middle" class="acc">POP</text>
  <line x1="300" y1="116" x2="300" y2="138" class="a"/>
  <circle cx="300" cy="150" r="8" class="s"/>

  <rect x="428" y="86" width="84" height="30" rx="4" class="a"/>
  <text x="470" y="105" text-anchor="middle" class="acc">POP</text>
  <line x1="470" y1="116" x2="470" y2="138" class="a"/>
  <circle cx="470" cy="150" r="8" class="s"/>

  <rect x="598" y="86" width="84" height="30" rx="4" class="a"/>
  <text x="640" y="105" text-anchor="middle" class="acc">POP</text>
  <line x1="640" y1="116" x2="640" y2="138" class="a"/>
  <circle cx="640" cy="150" r="8" class="s"/>

  <text x="706" y="140" class="acc">short</text>
  <text x="706" y="156" class="acc">hop</text>

  <!-- divider -->
  <line x1="40" y1="184" x2="760" y2="184" class="s" stroke-dasharray="3 5" opacity="0.5"/>

  <!-- SERVERLESS row -->
  <text x="40" y="216" class="text" style="font-weight:700">SERVERLESS · ONE REGION, LONG ROUND TRIP</text>
  <!-- users cluster far left -->
  <circle cx="96" cy="252" r="8" class="s"/>
  <circle cx="96" cy="284" r="8" class="s"/>
  <circle cx="128" cy="268" r="8" class="s"/>
  <text x="90" y="312" class="label">USERS</text>
  <!-- long arrow -->
  <line x1="150" y1="268" x2="588" y2="268" class="dg"/>
  <line x1="588" y1="268" x2="578" y2="262" class="dg"/>
  <line x1="588" y1="268" x2="578" y2="274" class="dg"/>
  <text x="360" y="258" text-anchor="middle" class="danger">LONG ROUND TRIP</text>
  <!-- single region -->
  <rect x="600" y="238" width="160" height="60" rx="4" class="s"/>
  <text x="680" y="266" text-anchor="middle" class="text" style="font-weight:700">REGION</text>
  <text x="680" y="286" text-anchor="middle" class="text">us-east-1</text>

  <text x="40" y="346" class="label">EDGE = SHORT HOPS EVERYWHERE · SERVERLESS = ONE FAR DATA CENTER</text>
</svg>
