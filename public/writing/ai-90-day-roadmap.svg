<svg viewBox="0 0 800 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-roadmap">
  <title id="t-roadmap">A 90-day learning roadmap from backend to applied AI engineer</title>
  <style>
    .text{fill:#1a1a24;font-family:Inter,system-ui,sans-serif;font-size:13px}
    .label{fill:#5c5c66;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:10.5px;letter-spacing:.08em}
    .mono{fill:#1a1a24;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11.5px}
    .acc{fill:#6028d9;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11px}
    .s{stroke:#1a1a24;fill:none;stroke-width:1.25}
    .sm{stroke:#b3b3bd;fill:none;stroke-width:1;stroke-dasharray:4 4}
    .a{stroke:#6028d9;fill:none;stroke-width:1.5}
    .fa{fill:#6028d9}
    .fs{fill:#f5f1e6}
    @media (prefers-color-scheme: dark){
      .text{fill:#e8e4d8}.label{fill:#9c9ca6}.mono{fill:#e8e4d8}.acc{fill:#b89be8}
      .s{stroke:#e8e4d8}.sm{stroke:#4a4a55}.a{stroke:#b89be8}.fa{fill:#b89be8}.fs{fill:#1a1a24}
    }
  </style>

  <text x="40" y="36" class="label">90 DAYS · ONE EVENING A DAY · BUILD-FIRST, NOT COURSE-FIRST</text>

  <line x1="40" y1="76" x2="760" y2="76" class="sm"/>
  <text x="40" y="98" class="acc">DAYS 1–30 · LLM MENTAL MODEL</text>
  <rect x="40" y="110" width="700" height="58" rx="4" class="s"/>
  <text x="60" y="132" class="text">Use Claude/ChatGPT/Cursor every day. Read a token-streaming primer. Build:</text>
  <text x="60" y="152" class="mono">  · a 30-line summariser  · a structured-output extractor  · a chat over your own notes</text>

  <line x1="40" y1="186" x2="760" y2="186" class="sm"/>
  <text x="40" y="208" class="acc">DAYS 31–60 · RAG + EVALS</text>
  <rect x="40" y="220" width="700" height="58" rx="4" class="fs"/>
  <rect x="40" y="220" width="700" height="58" rx="4" class="a"/>
  <text x="60" y="242" class="text">Embeddings, vector DB (Chroma or pgvector), chunking strategies. Then build evals first. Ship:</text>
  <text x="60" y="262" class="mono">  · a RAG bot over your team's docs  · 20-case eval suite  · a CI check that runs the evals</text>

  <line x1="40" y1="296" x2="760" y2="296" class="sm"/>
  <text x="40" y="318" class="acc">DAYS 61–90 · AGENTS + INTEGRATION</text>
  <rect x="40" y="330" width="700" height="20" rx="4" class="s"/>
  <text x="400" y="345" text-anchor="middle" class="mono">tool-use loops · MCP servers · production deploy · write one post about what you built</text>
</svg>
