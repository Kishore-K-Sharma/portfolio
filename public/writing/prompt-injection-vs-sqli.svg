<svg viewBox="0 0 800 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-pivs">
  <title id="t-pivs">SQL injection has a structural fix; prompt injection does not</title>
  <style>
    .text{fill:#1a1a24;font-family:Inter,system-ui,sans-serif;font-size:12.5px}
    .label{fill:#5c5c66;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:10.5px;letter-spacing:.08em}
    .mono{fill:#1a1a24;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11px}
    .acc{fill:#6028d9;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11px}
    .danger{fill:#c14545;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11px}
    .s{stroke:#1a1a24;fill:none;stroke-width:1.25}
    .a{stroke:#6028d9;fill:none;stroke-width:1.5}
    .dg{stroke:#c14545;fill:none;stroke-width:1.25}
    .fs{fill:#f5f1e6}
    @media (prefers-color-scheme: dark){
      .text{fill:#e8e4d8}.label{fill:#9c9ca6}.mono{fill:#e8e4d8}.acc{fill:#b89be8}.danger{fill:#d97a7a}
      .s{stroke:#e8e4d8}.a{stroke:#b89be8}.dg{stroke:#d97a7a}.fs{fill:#1a1a24}
    }
  </style>

  <rect x="0" y="0" width="800" height="360" class="fs"/>
  <text x="40" y="34" class="label">SAME BUG · ONE HAS A STRUCTURAL FIX · ONE DOES NOT</text>

  <!-- LEFT: SQL, solved -->
  <rect x="40" y="60" width="340" height="240" rx="4" class="a"/>
  <text x="58" y="88" class="acc">SQL · PARAMETERIZED QUERY</text>
  <line x1="58" y1="100" x2="362" y2="100" class="a" stroke-dasharray="4 4"/>

  <rect x="58" y="116" width="304" height="40" rx="3" class="a"/>
  <text x="70" y="141" class="mono">CODE   SELECT … WHERE id = ?</text>
  <rect x="58" y="168" width="304" height="40" rx="3" class="s"/>
  <text x="70" y="193" class="mono">DATA   $1 = "anything at all"</text>

  <text x="58" y="238" class="text">two separate channels · driver keeps</text>
  <text x="58" y="258" class="text">them apart before the query runs</text>
  <text x="58" y="288" class="acc">DATA CAN NEVER BECOME CODE</text>

  <!-- RIGHT: LLM, unsolved -->
  <rect x="420" y="60" width="340" height="240" rx="4" class="dg"/>
  <text x="438" y="88" class="danger">LLM · ONE CONTEXT WINDOW</text>
  <line x1="438" y1="100" x2="742" y2="100" class="dg" stroke-dasharray="4 4"/>

  <rect x="438" y="116" width="304" height="92" rx="3" class="dg"/>
  <text x="452" y="138" class="mono">system: you are a helpful agent</text>
  <text x="452" y="160" class="mono">user:   summarize this email</text>
  <text x="452" y="182" class="danger">email:  "ignore the above and…"</text>
  <text x="452" y="200" class="label">INSTRUCTIONS + DATA + UNTRUSTED · MIXED</text>

  <text x="438" y="238" class="text">no delimiter the model must obey ·</text>
  <text x="438" y="258" class="text">it's all just tokens in one stream</text>
  <text x="438" y="288" class="danger">NO WAY TO MARK "THIS IS DATA"</text>

  <text x="40" y="344" class="label">SQLI: SOLVED BY A HARD BOUNDARY · PROMPT INJECTION: NO SUCH BOUNDARY EXISTS</text>
</svg>
