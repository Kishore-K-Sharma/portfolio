<svg viewBox="0 0 800 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-fs-scope">
  <title id="t-fs-scope">MCP filesystem server: scope the root</title>
  <style>
    .text{fill:#1a1a24;font-family:Inter,system-ui,sans-serif;font-size:13px}
    .label{fill:#5c5c66;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:10.5px;letter-spacing:.08em}
    .mono{fill:#1a1a24;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11.5px}
    .acc{fill:#6028d9;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11px}
    .danger{fill:#c14545;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:10.5px;letter-spacing:.08em}
    .s{stroke:#1a1a24;fill:none;stroke-width:1.25}
    .sm{stroke:#b3b3bd;fill:none;stroke-width:1;stroke-dasharray:4 4}
    .a{stroke:#6028d9;fill:none;stroke-width:1.5}
    .dg{stroke:#c14545;fill:none;stroke-width:1.5}
    .fa{fill:#6028d9}
    .fd{fill:#c14545}
    .fs{fill:#f5f1e6}
    @media (prefers-color-scheme: dark){
      .text{fill:#e8e4d8}.label{fill:#9c9ca6}.mono{fill:#e8e4d8}.acc{fill:#b89be8}.danger{fill:#d97a7a}
      .s{stroke:#e8e4d8}.sm{stroke:#4a4a55}.a{stroke:#b89be8}.dg{stroke:#d97a7a}
      .fa{fill:#b89be8}.fd{fill:#d97a7a}.fs{fill:#1a1a24}
    }
  </style>

  <text x="40" y="36" class="label">MCP FILESYSTEM SERVER · SCOPE THE ROOT</text>

  <!-- Outer box (home dir) -->
  <rect x="40" y="60" width="440" height="220" rx="6" class="dg"/>
  <text x="60" y="84" class="danger">~ HOME · DEFAULT IF YOU DON'T SCOPE</text>
  <text x="60" y="112" class="mono">~/Documents</text>
  <text x="60" y="134" class="mono">~/.ssh/id_rsa</text>
  <text x="60" y="156" class="mono">~/.aws/credentials</text>
  <text x="60" y="178" class="mono">~/Downloads</text>
  <text x="60" y="200" class="mono">~/code/this-project</text>
  <text x="60" y="222" class="mono">~/code/other-project</text>
  <text x="60" y="244" class="mono">~/.config/private</text>

  <!-- Inner box (what's needed) -->
  <rect x="260" y="190" width="200" height="70" rx="4" class="a"/>
  <text x="278" y="214" class="acc">WHAT YOU ACTUALLY NEED</text>
  <text x="278" y="240" class="mono">~/code/this-project</text>

  <!-- Arrow narrowing -->
  <text x="540" y="100" class="text">If the server</text>
  <text x="540" y="118" class="text">can read ~/.ssh,</text>
  <text x="540" y="136" class="text">the model can</text>
  <text x="540" y="154" class="text">leak ~/.ssh.</text>

  <text x="540" y="200" class="acc">RESTRICT THE ROOT</text>
  <text x="540" y="220" class="text">Pass --root /one/dir</text>
  <text x="540" y="238" class="text">to the server.</text>
  <text x="540" y="256" class="text">Audit its tool list.</text>

  <text x="400" y="306" text-anchor="middle" class="label">DEFAULT WIDE · ONE PROMPT INJECTION AWAY FROM LEAK</text>
</svg>
