<svg viewBox="0 0 800 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-eag">
  <title id="t-eag">The eagerness dial trade-off</title>
  <style>
    .text{fill:#1a1a24;font-family:Inter,system-ui,sans-serif;font-size:12.5px}
    .label{fill:#5c5c66;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:10.5px;letter-spacing:.08em}
    .mono{fill:#1a1a24;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11px}
    .acc{fill:#6028d9;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11px}
    .danger{fill:#c14545;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11px}
    .s{stroke:#1a1a24;fill:none;stroke-width:1.25}
    .a{stroke:#6028d9;fill:none;stroke-width:3}
    .dg{stroke:#c14545;fill:none;stroke-width:3}
    .n{stroke:#1a1a24;fill:none;stroke-width:2}
    .fa{fill:#1a1a24}
    .fs{fill:#f5f1e6}
    @media (prefers-color-scheme: dark){
      .text{fill:#e8e4d8}.label{fill:#9c9ca6}.mono{fill:#e8e4d8}.acc{fill:#b89be8}.danger{fill:#d97a7a}
      .s{stroke:#e8e4d8}.a{stroke:#b89be8}.dg{stroke:#d97a7a}.n{stroke:#e8e4d8}.fa{fill:#e8e4d8}.fs{fill:#1a1a24}
    }
  </style>

  <rect x="0" y="0" width="800" height="360" class="fs"/>
  <text x="40" y="34" class="label">EAGERNESS · THE DIAL THAT SPENDS YOUR USERS' BANDWIDTH</text>

  <!-- gauge arc: left half purple (safe), right half red (waste) -->
  <path d="M 240 270 A 170 170 0 0 1 400 100" class="a"/>
  <path d="M 400 100 A 170 170 0 0 1 560 270" class="dg"/>

  <!-- ticks -->
  <line x1="240" y1="270" x2="222" y2="270" class="s"/>
  <line x1="400" y1="100" x2="400" y2="82" class="s"/>
  <line x1="560" y1="270" x2="578" y2="270" class="s"/>

  <!-- needle -> moderate (up) -->
  <circle cx="400" cy="270" r="6" class="fa"/>
  <line x1="400" y1="270" x2="400" y2="118" class="n"/>

  <!-- conservative -->
  <text x="150" y="255" class="acc">CONSERVATIVE</text>
  <text x="150" y="277" class="text">acts on click-start only</text>
  <text x="150" y="299" class="text">safe · minimal waste</text>
  <text x="150" y="321" class="text">smaller speedup</text>

  <!-- moderate -->
  <text x="400" y="66" text-anchor="middle" class="mono" style="font-weight:700">MODERATE</text>
  <text x="400" y="150" text-anchor="middle" class="text">acts on hover · sensible default</text>

  <!-- eager -->
  <text x="650" y="255" text-anchor="end" class="danger">EAGER</text>
  <text x="650" y="277" text-anchor="end" class="text">acts on the faintest hint</text>
  <text x="650" y="299" text-anchor="end" class="danger">✕ burns bandwidth + CPU</text>
  <text x="650" y="321" text-anchor="end" class="danger">✕ early GET side-effects</text>

  <text x="40" y="350" class="label">BE STINGY BY DEFAULT · SPEND EAGERNESS ONLY WHERE CONFIDENCE IS HIGH</text>
</svg>
