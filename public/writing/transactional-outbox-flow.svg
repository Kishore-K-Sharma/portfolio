<svg viewBox="0 0 800 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-outbox-flow">
  <title id="t-outbox-flow">The outbox fix: one DB transaction writes both the order and the outbox row, then a separate relay publishes outbox rows to Kafka and marks them sent</title>
  <style>
    .text{fill:#1a1a24;font-family:Inter,system-ui,sans-serif;font-size:13px}
    .label{fill:#5c5c66;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:10.5px;letter-spacing:.08em}
    .mono{fill:#1a1a24;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11.5px}
    .acc{fill:#6028d9;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11px}
    .danger{fill:#c14545;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:10.5px;letter-spacing:.08em}
    .s{stroke:#1a1a24;fill:none;stroke-width:1.25}
    .sm{stroke:#b3b3bd;fill:none;stroke-width:1;stroke-dasharray:4 4}
    .a{stroke:#6028d9;fill:none;stroke-width:1.5}
    .dg{stroke:#c14545;fill:none;stroke-width:1.25}
    .fa{fill:#6028d9}
    .fd{fill:#c14545}
    .fs{fill:#f5f1e6}
    @media (prefers-color-scheme: dark){
      .text{fill:#e8e4d8}.label{fill:#9c9ca6}.mono{fill:#e8e4d8}.acc{fill:#b89be8}.danger{fill:#d97a7a}
      .s{stroke:#e8e4d8}.sm{stroke:#4a4a55}.a{stroke:#b89be8}.dg{stroke:#d97a7a}
      .fa{fill:#b89be8}.fd{fill:#d97a7a}.fs{fill:#1a1a24}
    }
  </style>

  <text x="40" y="36" class="label">ONE LOCAL TRANSACTION WRITES BOTH ROWS · A SEPARATE RELAY CATCHES THE BROKER UP</text>

  <!-- OrderService -->
  <rect x="36" y="120" width="120" height="80" rx="4" class="s"/>
  <text x="96" y="152" text-anchor="middle" class="acc">OrderService</text>
  <text x="96" y="174" text-anchor="middle" class="text">@Transactional</text>
  <text x="96" y="192" text-anchor="middle" class="label">ATOMIC SAVE</text>

  <line x1="156" y1="160" x2="196" y2="160" class="a"/>
  <polygon points="196,160 186,155 186,165" class="fa"/>

  <!-- Postgres transaction boundary -->
  <rect x="196" y="80" width="220" height="180" rx="4" class="fs"/>
  <rect x="196" y="80" width="220" height="180" rx="4" class="a"/>
  <text x="306" y="104" text-anchor="middle" class="acc">POSTGRES · ONE TXN</text>

  <rect x="220" y="120" width="172" height="50" rx="4" class="s"/>
  <text x="306" y="140" text-anchor="middle" class="text">orders</text>
  <text x="306" y="158" text-anchor="middle" class="label">DOMAIN ROW</text>

  <rect x="220" y="186" width="172" height="50" rx="4" class="s"/>
  <text x="306" y="206" text-anchor="middle" class="text">outbox</text>
  <text x="306" y="224" text-anchor="middle" class="label">EVENT ROW · UNSENT</text>

  <text x="306" y="252" text-anchor="middle" class="acc">COMMIT — BOTH OR NEITHER</text>

  <!-- Relay reads outbox -->
  <line x1="416" y1="211" x2="470" y2="211" class="a"/>
  <polygon points="470,211 460,206 460,216" class="fa"/>
  <text x="443" y="200" text-anchor="middle" class="label">POLL</text>

  <!-- Relay box -->
  <rect x="470" y="176" width="150" height="80" rx="4" class="s"/>
  <text x="545" y="204" text-anchor="middle" class="acc">RELAY</text>
  <text x="545" y="226" text-anchor="middle" class="text">SKIP LOCKED</text>
  <text x="545" y="244" text-anchor="middle" class="text">or Debezium CDC</text>

  <!-- mark sent loops back -->
  <path d="M 545 176 C 545 130 440 130 408 165" class="sm"/>
  <polygon points="408,165 418,162 414,153" class="fd" opacity="0"/>
  <polygon points="410,164 420,162 416,153" class="fa"/>
  <text x="470" y="128" text-anchor="middle" class="label">MARK SENT</text>

  <!-- Relay publishes to Kafka -->
  <line x1="620" y1="216" x2="676" y2="216" class="a"/>
  <polygon points="676,216 666,211 666,221" class="fa"/>

  <!-- Kafka -->
  <rect x="676" y="176" width="90" height="80" rx="4" class="s"/>
  <text x="721" y="210" text-anchor="middle" class="acc">KAFKA</text>
  <text x="721" y="230" text-anchor="middle" class="label">OrderPlaced</text>

  <text x="400" y="298" text-anchor="middle" class="label">DB IS THE SOURCE OF TRUTH · DELIVERY IS AT-LEAST-ONCE · CONSUMERS STAY IDEMPOTENT</text>
</svg>
