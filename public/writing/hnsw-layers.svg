<svg viewBox="0 0 800 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-lay">
  <title id="t-lay">HNSW is a stack of proximity graphs; search descends from a sparse top layer to the dense bottom</title>
  <style>
    .text{fill:#1a1a24;font-family:Inter,system-ui,sans-serif;font-size:12.5px}
    .label{fill:#5c5c66;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:10.5px;letter-spacing:.08em}
    .mono{fill:#1a1a24;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11px}
    .acc{fill:#6028d9;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11px}
    .danger{fill:#c14545;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11px}
    .s{stroke:#1a1a24;fill:none;stroke-width:1.25}
    .a{stroke:#6028d9;fill:none;stroke-width:1.75}
    .dg{stroke:#c14545;fill:none;stroke-width:1.25}
    .fdot{fill:#1a1a24}
    .fadot{fill:#6028d9}
    .fddot{fill:#c14545}
    .fs{fill:#f5f1e6}
    @media (prefers-color-scheme: dark){
      .text{fill:#e8e4d8}.label{fill:#9c9ca6}.mono{fill:#e8e4d8}.acc{fill:#b89be8}.danger{fill:#d97a7a}
      .s{stroke:#e8e4d8}.a{stroke:#b89be8}.dg{stroke:#d97a7a}
      .fdot{fill:#e8e4d8}.fadot{fill:#b89be8}.fddot{fill:#d97a7a}.fs{fill:#1a1a24}
    }
  </style>

  <rect x="0" y="0" width="800" height="360" class="fs"/>
  <text x="40" y="30" class="label">HNSW · LAYERED PROXIMITY GRAPH · GREEDY DESCENT</text>

  <!-- LAYER 2 (top, sparse) -->
  <text x="40" y="76" class="label">LAYER 2 · SPARSE · EXPRESS LANES</text>
  <!-- long edges -->
  <line x1="110" y1="90" x2="360" y2="102" class="s"/>
  <line x1="360" y1="102" x2="620" y2="88" class="s"/>
  <circle cx="110" cy="90" r="6" class="fadot"/>
  <text x="86" y="82" class="acc">entry</text>
  <circle cx="360" cy="102" r="5" class="fdot"/>
  <circle cx="620" cy="88" r="5" class="fdot"/>

  <!-- LAYER 1 (middle, denser) -->
  <text x="40" y="168" class="label">LAYER 1 · DENSER</text>
  <line x1="150" y1="185" x2="300" y2="192" class="s"/>
  <line x1="300" y1="192" x2="430" y2="180" class="s"/>
  <line x1="430" y1="180" x2="560" y2="195" class="s"/>
  <line x1="150" y1="185" x2="230" y2="200" class="s"/>
  <line x1="430" y1="180" x2="500" y2="168" class="s"/>
  <circle cx="150" cy="185" r="5" class="fdot"/>
  <circle cx="230" cy="200" r="5" class="fdot"/>
  <circle cx="300" cy="192" r="5" class="fdot"/>
  <circle cx="430" cy="180" r="5" class="fdot"/>
  <circle cx="500" cy="168" r="5" class="fdot"/>
  <circle cx="560" cy="195" r="5" class="fdot"/>

  <!-- LAYER 0 (bottom, all nodes dense) -->
  <text x="40" y="268" class="label">LAYER 0 · ALL NODES · DENSE SHORT-RANGE LINKS</text>
  <line x1="120" y1="300" x2="185" y2="288" class="s"/>
  <line x1="185" y1="288" x2="250" y2="305" class="s"/>
  <line x1="250" y1="305" x2="315" y2="290" class="s"/>
  <line x1="315" y1="290" x2="380" y2="308" class="s"/>
  <line x1="380" y1="308" x2="445" y2="292" class="s"/>
  <line x1="445" y1="292" x2="510" y2="305" class="s"/>
  <line x1="510" y1="305" x2="575" y2="290" class="s"/>
  <line x1="185" y1="288" x2="250" y2="288" class="s" opacity="0.5"/>
  <line x1="315" y1="290" x2="380" y2="290" class="s" opacity="0.5"/>
  <line x1="445" y1="292" x2="510" y2="292" class="s" opacity="0.5"/>
  <circle cx="120" cy="300" r="4.5" class="fdot"/>
  <circle cx="185" cy="288" r="4.5" class="fdot"/>
  <circle cx="250" cy="305" r="4.5" class="fdot"/>
  <circle cx="315" cy="290" r="4.5" class="fdot"/>
  <circle cx="380" cy="308" r="4.5" class="fdot"/>
  <circle cx="445" cy="292" r="4.5" class="fddot"/>
  <text x="430" y="338" class="danger">query · target</text>
  <circle cx="510" cy="305" r="4.5" class="fdot"/>
  <circle cx="575" cy="290" r="4.5" class="fdot"/>

  <!-- descent path (accent, dashed) crossing layers -->
  <path d="M110,90 L360,102" class="a" stroke-dasharray="4 4"/>
  <path d="M360,102 C 360,140 300,150 300,192" class="a" stroke-dasharray="4 4"/>
  <path d="M300,192 L430,180" class="a" stroke-dasharray="4 4"/>
  <path d="M430,180 C 430,230 445,250 445,292" class="a" stroke-dasharray="4 4"/>

  <!-- descent arrows on right -->
  <text x="650" y="150" class="acc">enter top,</text>
  <text x="650" y="168" class="acc">take big jumps</text>
  <text x="650" y="230" class="acc">drop a layer,</text>
  <text x="650" y="248" class="acc">refine</text>
  <text x="650" y="310" class="danger">layer 0:</text>
  <text x="650" y="328" class="danger">best-first, top-k</text>
</svg>
