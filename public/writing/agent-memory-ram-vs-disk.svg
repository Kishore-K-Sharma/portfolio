<svg viewBox="0 0 800 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-mram">
  <title id="t-mram">The context window is RAM, not memory</title>
  <style>
    .text{fill:#1a1a24;font-family:Inter,system-ui,sans-serif;font-size:12.5px}
    .label{fill:#5c5c66;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:10.5px;letter-spacing:.08em}
    .mono{fill:#1a1a24;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11px}
    .acc{fill:#6028d9;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11px}
    .danger{fill:#c14545;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11px}
    .s{stroke:#1a1a24;fill:none;stroke-width:1.25}
    .a{stroke:#6028d9;fill:none;stroke-width:1.5}
    .dg{stroke:#c14545;fill:none;stroke-width:1.25}
    .fs{fill:#f5f1e6}
    @media (prefers-color-scheme: dark){
      .text{fill:#e8e4d8}.label{fill:#9c9ca6}.mono{fill:#e8e4d8}.acc{fill:#b89be8}.danger{fill:#d97a7a}
      .s{stroke:#e8e4d8}.a{stroke:#b89be8}.dg{stroke:#d97a7a}.fs{fill:#1a1a24}
    }
  </style>

  <rect x="0" y="0" width="800" height="360" class="fs"/>
  <text x="40" y="34" class="label">CONTEXT WINDOW = RAM · MEMORY SYSTEM = DISK</text>

  <!-- RAM side -->
  <rect x="40" y="60" width="330" height="240" rx="4" class="s"/>
  <text x="58" y="88" class="text" style="font-weight:700">CONTEXT WINDOW</text>
  <text x="58" y="106" class="label">THE RAM</text>
  <line x1="58" y1="118" x2="352" y2="118" class="s" stroke-dasharray="4 4"/>
  <text x="58" y="144" class="text">✓ big &amp; fast (1M tokens)</text>
  <text x="58" y="168" class="text">✓ everything in one place</text>
  <text x="58" y="200" class="danger">✕ session-scoped</text>
  <text x="58" y="224" class="danger">✕ wiped the moment you exit</text>
  <text x="58" y="278" class="danger">A STRANGER EVERY MORNING</text>

  <!-- arrow -->
  <line x1="378" y1="180" x2="422" y2="180" class="a"/>
  <text x="400" y="170" text-anchor="middle" class="acc">persist</text>

  <!-- DISK side -->
  <rect x="430" y="60" width="330" height="240" rx="4" class="a"/>
  <text x="448" y="88" class="acc" style="font-weight:700">MEMORY SYSTEM</text>
  <text x="448" y="106" class="label">THE DISK</text>
  <line x1="448" y1="118" x2="742" y2="118" class="a" stroke-dasharray="4 4"/>
  <text x="448" y="144" class="text">✓ survives every session</text>
  <text x="448" y="168" class="acc">files / markdown</text>
  <text x="448" y="192" class="acc">vector store</text>
  <text x="448" y="216" class="acc">knowledge graph</text>
  <text x="448" y="278" class="acc">YOU BUILD THIS — THE MODEL DOESN'T</text>

  <text x="40" y="344" class="label">THE MODEL FORGETS EVERYTHING · THE PRODUCT REMEMBERS</text>
</svg>
