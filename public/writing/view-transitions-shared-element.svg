<svg viewBox="0 0 800 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-vtse">
  <title id="t-vtse">A shared-element morph between two pages</title>
  <style>
    .text{fill:#1a1a24;font-family:Inter,system-ui,sans-serif;font-size:12.5px}
    .label{fill:#5c5c66;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:10.5px;letter-spacing:.08em}
    .mono{fill:#1a1a24;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11px}
    .acc{fill:#6028d9;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11px}
    .s{stroke:#1a1a24;fill:none;stroke-width:1.25}
    .a{stroke:#6028d9;fill:none;stroke-width:1.5}
    .fs{fill:#f5f1e6}
    @media (prefers-color-scheme: dark){
      .text{fill:#e8e4d8}.label{fill:#9c9ca6}.mono{fill:#e8e4d8}.acc{fill:#b89be8}
      .s{stroke:#e8e4d8}.a{stroke:#b89be8}.fs{fill:#1a1a24}
    }
  </style>

  <rect x="0" y="0" width="800" height="360" class="fs"/>
  <text x="40" y="34" class="label">SHARED-ELEMENT MORPH · MATCHING view-transition-name</text>

  <!-- grid page -->
  <rect x="40" y="56" width="310" height="250" rx="4" class="s"/>
  <text x="58" y="80" class="label">GRID PAGE</text>
  <!-- highlighted thumbnail -->
  <rect x="58" y="96" width="84" height="76" rx="3" class="a"/>
  <text x="100" y="139" text-anchor="middle" class="acc">hero-photo</text>
  <!-- other thumbnails -->
  <rect x="154" y="96" width="84" height="76" rx="3" class="s"/>
  <rect x="250" y="96" width="84" height="76" rx="3" class="s"/>
  <rect x="58" y="184" width="84" height="76" rx="3" class="s"/>
  <rect x="154" y="184" width="84" height="76" rx="3" class="s"/>
  <rect x="250" y="184" width="84" height="76" rx="3" class="s"/>
  <text x="58" y="290" class="text">one thumbnail is named</text>

  <!-- detail page -->
  <rect x="450" y="56" width="310" height="250" rx="4" class="s"/>
  <text x="468" y="80" class="label">DETAIL PAGE</text>
  <rect x="468" y="96" width="274" height="150" rx="3" class="a"/>
  <text x="605" y="176" text-anchor="middle" class="acc">hero-photo</text>
  <text x="468" y="290" class="text">the hero carries the same name</text>

  <!-- morph connector -->
  <line x1="358" y1="180" x2="444" y2="130" class="a" stroke-dasharray="4 4"/>
  <line x1="358" y1="180" x2="444" y2="238" class="a" stroke-dasharray="4 4"/>
  <text x="401" y="164" text-anchor="middle" class="label">MORPHS</text>
  <text x="401" y="204" text-anchor="middle" class="acc">→</text>

  <text x="40" y="344" class="label">SAME NAME IN BOTH STATES → THE BROWSER TWEENS SIZE + POSITION, NO CROSSFADE</text>
</svg>
