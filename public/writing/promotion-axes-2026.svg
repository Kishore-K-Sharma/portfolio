<svg viewBox="0 0 800 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-promo">
  <title id="t-promo">The three axes a 2026 promotion case lives on</title>
  <style>
    .text{fill:#1a1a24;font-family:Inter,system-ui,sans-serif;font-size:13px}
    .label{fill:#5c5c66;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:10.5px;letter-spacing:.08em}
    .mono{fill:#1a1a24;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11.5px}
    .acc{fill:#6028d9;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11px}
    .s{stroke:#1a1a24;fill:none;stroke-width:1.25}
    .sm{stroke:#b3b3bd;fill:none;stroke-width:1;stroke-dasharray:4 4}
    .a{stroke:#6028d9;fill:none;stroke-width:1.5}
    .fa{fill:#6028d9}
    .fs{fill:#f5f1e6}
    @media (prefers-color-scheme: dark){
      .text{fill:#e8e4d8}.label{fill:#9c9ca6}.mono{fill:#e8e4d8}.acc{fill:#b89be8}
      .s{stroke:#e8e4d8}.sm{stroke:#4a4a55}.a{stroke:#b89be8}.fa{fill:#b89be8}.fs{fill:#1a1a24}
    }
  </style>

  <text x="40" y="36" class="label">PROMOTION TO SENIOR / STAFF · 2026 · WHAT REVIEW COMMITTEES ACTUALLY WEIGHT</text>

  <rect x="40" y="78" width="230" height="240" rx="4" class="fs"/>
  <rect x="40" y="78" width="230" height="240" rx="4" class="a"/>
  <text x="155" y="106" text-anchor="middle" class="acc">01 · LEVERAGE</text>
  <text x="155" y="124" text-anchor="middle" class="label">DID YOUR WORK MULTIPLY OTHERS?</text>
  <line x1="60" y1="138" x2="250" y2="138" class="sm"/>
  <text x="60" y="162" class="text">platforms used by</text>
  <text x="60" y="178" class="text">other teams</text>
  <text x="60" y="206" class="text">evals that prevented</text>
  <text x="60" y="222" class="text">regressions</text>
  <text x="60" y="250" class="text">tooling that cut PR</text>
  <text x="60" y="266" class="text">cycle time</text>
  <text x="60" y="294" class="acc">EVIDENCE: USAGE METRICS</text>

  <rect x="285" y="78" width="230" height="240" rx="4" class="fs"/>
  <rect x="285" y="78" width="230" height="240" rx="4" class="a"/>
  <text x="400" y="106" text-anchor="middle" class="acc">02 · JUDGMENT</text>
  <text x="400" y="124" text-anchor="middle" class="label">DID YOU KILL THE WRONG WORK?</text>
  <line x1="305" y1="138" x2="495" y2="138" class="sm"/>
  <text x="305" y="162" class="text">scoped down a feature</text>
  <text x="305" y="178" class="text">that should have been</text>
  <text x="305" y="194" class="text">smaller</text>
  <text x="305" y="222" class="text">said no to an AI</text>
  <text x="305" y="238" class="text">refactor that wasn't</text>
  <text x="305" y="254" class="text">worth it</text>
  <text x="305" y="282" class="text">spotted the design</text>
  <text x="305" y="298" class="text">flaw at PR time</text>

  <rect x="530" y="78" width="230" height="240" rx="4" class="fs"/>
  <rect x="530" y="78" width="230" height="240" rx="4" class="a"/>
  <text x="645" y="106" text-anchor="middle" class="acc">03 · MULTIPLIERS</text>
  <text x="645" y="124" text-anchor="middle" class="label">DID YOU MAKE OTHERS BETTER?</text>
  <line x1="550" y1="138" x2="740" y2="138" class="sm"/>
  <text x="550" y="162" class="text">code reviews that</text>
  <text x="550" y="178" class="text">taught, not just</text>
  <text x="550" y="194" class="text">graded</text>
  <text x="550" y="222" class="text">docs that the team</text>
  <text x="550" y="238" class="text">actually opens</text>
  <text x="550" y="266" class="text">someone got promoted</text>
  <text x="550" y="282" class="text">because of your</text>
  <text x="550" y="298" class="text">mentoring</text>

  <text x="400" y="346" text-anchor="middle" class="label">"SHIPPED A LOT" IS NOT ON THIS LIST · OUTPUT WITHOUT LEVERAGE STOPS SCORING</text>
</svg>
