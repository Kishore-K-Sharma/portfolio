<svg viewBox="0 0 800 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-ssp">
  <title id="t-ssp">Baseline emits one token per expensive target pass; speculative decoding emits several accepted tokens per pass, and the speedup equals the average accepted per pass</title>
  <style>
    .text{fill:#1a1a24;font-family:Inter,system-ui,sans-serif;font-size:12.5px}
    .label{fill:#5c5c66;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:10.5px;letter-spacing:.08em}
    .mono{fill:#1a1a24;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11px}
    .acc{fill:#6028d9;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11px}
    .danger{fill:#c14545;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11px}
    .s{stroke:#1a1a24;fill:none;stroke-width:1.25}
    .a{stroke:#6028d9;fill:none;stroke-width:1.5}
    .dg{stroke:#c14545;fill:none;stroke-width:1.25}
    .fac{fill:#6028d9;opacity:0.12}
    .fs{fill:#f5f1e6}
    @media (prefers-color-scheme: dark){
      .text{fill:#e8e4d8}.label{fill:#9c9ca6}.mono{fill:#e8e4d8}.acc{fill:#b89be8}.danger{fill:#d97a7a}
      .s{stroke:#e8e4d8}.a{stroke:#b89be8}.dg{stroke:#d97a7a}.fac{fill:#b89be8;opacity:0.16}.fs{fill:#1a1a24}
    }
  </style>

  <rect x="0" y="0" width="800" height="360" class="fs"/>
  <text x="40" y="34" class="label">SPEEDUP ≈ TOKENS ACCEPTED PER EXPENSIVE TARGET PASS</text>

  <!-- BASELINE row -->
  <text x="40" y="82" class="text" style="font-weight:700">BASELINE</text>
  <text x="40" y="100" class="label">1 token / target pass</text>

  <!-- 3 expensive passes, one token each -->
  <g>
    <rect x="200" y="64" width="120" height="46" rx="4" class="s"/>
    <rect x="340" y="64" width="120" height="46" rx="4" class="s"/>
    <rect x="480" y="64" width="120" height="46" rx="4" class="s"/>
  </g>
  <text x="260" y="92" text-anchor="middle" class="mono">pass → 1</text>
  <text x="400" y="92" text-anchor="middle" class="mono">pass → 1</text>
  <text x="540" y="92" text-anchor="middle" class="mono">pass → 1</text>
  <text x="620" y="92" class="label">3 passes → 3 tokens</text>

  <!-- SPECULATIVE row -->
  <text x="40" y="182" class="acc" style="font-weight:700">SPECULATIVE</text>
  <text x="40" y="200" class="label">~3 tokens / target pass</text>

  <!-- 1 expensive pass yielding 3 tokens -->
  <rect x="200" y="164" width="400" height="46" rx="4" class="fac"/>
  <rect x="200" y="164" width="400" height="46" rx="4" class="a"/>
  <text x="400" y="192" text-anchor="middle" class="acc">1 pass → 3 accepted tokens</text>
  <text x="620" y="192" class="acc">1 pass → 3 tokens</text>

  <!-- speedup bracket -->
  <rect x="200" y="250" width="400" height="58" rx="4" class="a"/>
  <text x="400" y="278" text-anchor="middle" class="acc" style="font-size:15px;font-weight:700">≈ 3× WALL-CLOCK</text>
  <text x="400" y="298" text-anchor="middle" class="text">same expensive passes, more tokens each</text>

  <text x="40" y="338" class="acc">Lossless: identical output distribution — you pay for speed in extra draft work, not in quality.</text>
</svg>
