<svg viewBox="0 0 800 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-evg">
  <title id="t-evg">The eBPF verifier gate</title>
  <style>
    .text{fill:#1a1a24;font-family:Inter,system-ui,sans-serif;font-size:12.5px}
    .label{fill:#5c5c66;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:10.5px;letter-spacing:.08em}
    .mono{fill:#1a1a24;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11px}
    .acc{fill:#6028d9;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11px}
    .danger{fill:#c14545;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11px}
    .s{stroke:#1a1a24;fill:none;stroke-width:1.25}
    .a{stroke:#6028d9;fill:none;stroke-width:1.5}
    .dg{stroke:#c14545;fill:none;stroke-width:1.25}
    .fs{fill:#f5f1e6}
    @media (prefers-color-scheme: dark){
      .text{fill:#e8e4d8}.label{fill:#9c9ca6}.mono{fill:#e8e4d8}.acc{fill:#b89be8}.danger{fill:#d97a7a}
      .s{stroke:#e8e4d8}.a{stroke:#b89be8}.dg{stroke:#d97a7a}.fs{fill:#1a1a24}
    }
  </style>

  <rect x="0" y="0" width="800" height="360" class="fs"/>
  <text x="40" y="34" class="label">THE LOAD PATH — EVERY eBPF PROGRAM MUST PASS THE VERIFIER FIRST</text>

  <!-- source program -->
  <rect x="40" y="132" width="150" height="80" rx="4" class="s"/>
  <text x="115" y="164" text-anchor="middle" class="mono">eBPF BYTECODE</text>
  <text x="115" y="186" text-anchor="middle" class="text">your program</text>
  <line x1="190" y1="172" x2="248" y2="172" class="s"/>
  <text x="196" y="164" class="label">LOAD ▸</text>

  <!-- verifier gate -->
  <rect x="250" y="72" width="250" height="200" rx="4" class="a"/>
  <text x="375" y="102" text-anchor="middle" class="acc">THE VERIFIER</text>
  <text x="270" y="132" class="text">statically proves, before load:</text>
  <text x="270" y="160" class="mono">· bounded loops only</text>
  <text x="270" y="184" class="mono">· every memory access valid</text>
  <text x="270" y="208" class="mono">· the program terminates</text>
  <text x="270" y="232" class="mono">· no leaking kernel pointers</text>
  <text x="375" y="260" text-anchor="middle" class="label">PROVE IT SAFE OR IT NEVER RUNS</text>

  <!-- pass path -->
  <line x1="500" y1="120" x2="560" y2="120" class="a"/>
  <text x="508" y="112" class="acc">PASS ▸</text>
  <rect x="560" y="98" width="200" height="46" rx="4" class="s"/>
  <text x="660" y="126" text-anchor="middle" class="mono">JIT → NATIVE CODE</text>
  <line x1="660" y1="144" x2="660" y2="172" class="a"/>
  <rect x="560" y="172" width="200" height="46" rx="4" class="a"/>
  <text x="660" y="200" text-anchor="middle" class="acc">ATTACHED TO HOOK ✓</text>

  <!-- fail path -->
  <line x1="375" y1="272" x2="375" y2="300" class="dg"/>
  <text x="388" y="292" class="danger">FAIL ▾</text>
  <rect x="250" y="300" width="250" height="42" rx="4" class="dg"/>
  <text x="375" y="326" text-anchor="middle" class="danger">REJECTED — LOADED CODE NEVER RUNS ✕</text>

  <text x="40" y="352" class="label">UNBOUNDED LOOP · BAD POINTER · MIGHT NOT HALT → BOUNCED AT THE GATE. THIS IS WHY IT'S SAFE IN-KERNEL</text>
</svg>
