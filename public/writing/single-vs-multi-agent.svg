<svg viewBox="0 0 800 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-svm">
  <title id="t-svm">Single agent versus multi-agent</title>
  <style>
    .text{fill:#1a1a24;font-family:Inter,system-ui,sans-serif;font-size:12.5px}
    .label{fill:#5c5c66;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:10.5px;letter-spacing:.08em}
    .mono{fill:#1a1a24;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11px}
    .acc{fill:#6028d9;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11px}
    .s{stroke:#1a1a24;fill:none;stroke-width:1.25}
    .a{stroke:#6028d9;fill:none;stroke-width:1.5}
    .fs{fill:#f5f1e6}
    @media (prefers-color-scheme: dark){
      .text{fill:#e8e4d8}.label{fill:#9c9ca6}.mono{fill:#e8e4d8}.acc{fill:#b89be8}
      .s{stroke:#e8e4d8}.a{stroke:#b89be8}.fs{fill:#1a1a24}
    }
  </style>

  <rect x="0" y="0" width="800" height="360" class="fs"/>
  <text x="40" y="34" class="label">ONE AGENT + GOOD TOOLS  vs  ORCHESTRATOR + SPECIALISTS</text>

  <!-- LEFT: single -->
  <rect x="40" y="56" width="330" height="230" rx="4" class="s"/>
  <text x="205" y="88" text-anchor="middle" class="text" style="font-weight:700">ONE AGENT</text>
  <rect x="140" y="104" width="130" height="44" rx="4" class="a"/>
  <text x="205" y="131" text-anchor="middle" class="acc">AGENT</text>
  <rect x="80" y="188" width="80" height="36" rx="4" class="s"/>
  <text x="120" y="211" text-anchor="middle" class="mono">tool</text>
  <rect x="170" y="188" width="80" height="36" rx="4" class="s"/>
  <text x="210" y="211" text-anchor="middle" class="mono">tool</text>
  <rect x="260" y="188" width="80" height="36" rx="4" class="s"/>
  <text x="300" y="211" text-anchor="middle" class="mono">tool</text>
  <line x1="205" y1="148" x2="120" y2="186" class="s"/>
  <line x1="205" y1="148" x2="210" y2="186" class="s"/>
  <line x1="205" y1="148" x2="300" y2="186" class="s"/>
  <text x="205" y="258" text-anchor="middle" class="label">SIMPLE · CHEAP · ONE CONTEXT</text>

  <!-- RIGHT: multi -->
  <rect x="430" y="56" width="330" height="230" rx="4" class="a"/>
  <text x="595" y="88" text-anchor="middle" class="acc">ORCHESTRATOR + SPECIALISTS</text>
  <rect x="530" y="104" width="130" height="44" rx="4" class="a"/>
  <text x="595" y="131" text-anchor="middle" class="acc">ORCHESTRATOR</text>
  <rect x="450" y="188" width="90" height="40" rx="4" class="s"/>
  <text x="495" y="212" text-anchor="middle" class="mono">research</text>
  <rect x="550" y="188" width="90" height="40" rx="4" class="s"/>
  <text x="595" y="212" text-anchor="middle" class="mono">coding</text>
  <rect x="650" y="188" width="90" height="40" rx="4" class="s"/>
  <text x="695" y="212" text-anchor="middle" class="mono">data</text>
  <line x1="595" y1="148" x2="495" y2="186" class="a"/>
  <line x1="595" y1="148" x2="595" y2="186" class="a"/>
  <line x1="595" y1="148" x2="695" y2="186" class="a"/>
  <text x="595" y="252" text-anchor="middle" class="label">OWNERSHIP · SCALING · ISOLATION</text>
  <text x="595" y="270" text-anchor="middle" class="acc">+ coordination overhead</text>

  <text x="40" y="330" class="label">DECIDE BY NEED, NOT VIBES: SPLIT WHEN OWNERSHIP, SCALING, OR ISOLATION DEMAND IT</text>
  <text x="40" y="350" class="label">DISTRIBUTION IS A COST YOU PAY — NOT A FEATURE YOU ADD</text>
</svg>
