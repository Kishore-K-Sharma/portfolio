<svg viewBox="0 0 800 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-mloop">
  <title id="t-mloop">The agent memory loop</title>
  <style>
    .text{fill:#1a1a24;font-family:Inter,system-ui,sans-serif;font-size:12.5px}
    .label{fill:#5c5c66;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:10.5px;letter-spacing:.08em}
    .mono{fill:#1a1a24;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:10px}
    .acc{fill:#6028d9;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11px}
    .s{stroke:#1a1a24;fill:none;stroke-width:1.25}
    .a{stroke:#6028d9;fill:none;stroke-width:1.5}
    .fa{fill:#6028d9}
    .fs{fill:#f5f1e6}
    @media (prefers-color-scheme: dark){
      .text{fill:#e8e4d8}.label{fill:#9c9ca6}.mono{fill:#e8e4d8}.acc{fill:#b89be8}
      .s{stroke:#e8e4d8}.a{stroke:#b89be8}.fa{fill:#b89be8}.fs{fill:#1a1a24}
    }
  </style>

  <rect x="0" y="0" width="800" height="360" class="fs"/>
  <text x="40" y="34" class="label">THE WRITE PATH IS THE HARD PART · EXTRACT · STORE · RECALL · INJECT</text>

  <defs>
    <marker id="ah" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6" class="a"/>
    </marker>
  </defs>

  <!-- SESSION -->
  <rect x="40" y="100" width="128" height="92" rx="4" class="s"/>
  <text x="104" y="140" text-anchor="middle" class="text" style="font-weight:700">SESSION</text>
  <text x="104" y="162" text-anchor="middle" class="mono">what happened</text>

  <!-- EXTRACT -->
  <rect x="188" y="100" width="128" height="92" rx="4" class="s"/>
  <text x="252" y="140" text-anchor="middle" class="text" style="font-weight:700">EXTRACT</text>
  <text x="252" y="162" text-anchor="middle" class="mono">what's salient</text>

  <!-- STORE (accent — the hard part) -->
  <rect x="336" y="100" width="128" height="92" rx="4" class="a"/>
  <text x="400" y="136" text-anchor="middle" class="acc">STORE</text>
  <text x="400" y="158" text-anchor="middle" class="mono">update or append</text>
  <text x="400" y="174" text-anchor="middle" class="mono">invalidate stale</text>

  <!-- RECALL -->
  <rect x="484" y="100" width="128" height="92" rx="4" class="a"/>
  <text x="548" y="136" text-anchor="middle" class="acc">RECALL</text>
  <text x="548" y="158" text-anchor="middle" class="mono">core at start</text>
  <text x="548" y="174" text-anchor="middle" class="mono">+ search on demand</text>

  <!-- INJECT -->
  <rect x="632" y="100" width="128" height="92" rx="4" class="s"/>
  <text x="696" y="140" text-anchor="middle" class="text" style="font-weight:700">INJECT</text>
  <text x="696" y="162" text-anchor="middle" class="mono">into next context</text>

  <!-- arrows between -->
  <line x1="168" y1="146" x2="186" y2="146" class="a" marker-end="url(#ah)"/>
  <line x1="316" y1="146" x2="334" y2="146" class="a" marker-end="url(#ah)"/>
  <line x1="464" y1="146" x2="482" y2="146" class="a" marker-end="url(#ah)"/>
  <line x1="612" y1="146" x2="630" y2="146" class="a" marker-end="url(#ah)"/>

  <!-- return loop: INJECT -> down -> back -> up into SESSION -->
  <path d="M696,192 L696,250 L104,250 L104,194" class="a" fill="none" marker-end="url(#ah)"/>
  <text x="400" y="270" text-anchor="middle" class="acc">repeat — the model forgets, the loop remembers</text>

  <text x="40" y="336" class="label">SAVE CORRECTIONS &amp; PREFERENCES · NOT CHIT-CHAT · FORGET WHAT WENT STALE</text>
</svg>
