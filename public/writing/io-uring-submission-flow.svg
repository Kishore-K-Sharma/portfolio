<svg viewBox="0 0 800 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-flow">
  <title id="t-flow">The io_uring submission-to-completion flow in six numbered steps</title>
  <style>
    .text{fill:#1a1a24;font-family:Inter,system-ui,sans-serif;font-size:12.5px}
    .label{fill:#5c5c66;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:10.5px;letter-spacing:.06em}
    .mono{fill:#1a1a24;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11px}
    .acc{fill:#6028d9;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11px}
    .danger{fill:#c14545;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11px}
    .s{stroke:#1a1a24;fill:none;stroke-width:1.25}
    .a{stroke:#6028d9;fill:none;stroke-width:1.5}
    .dg{stroke:#c14545;fill:none;stroke-width:1.25}
    .fs{fill:#f5f1e6}
    .facc{fill:#6028d9;opacity:0.07}
    @media (prefers-color-scheme: dark){
      .text{fill:#e8e4d8}.label{fill:#9c9ca6}.mono{fill:#e8e4d8}.acc{fill:#b89be8}.danger{fill:#d97a7a}
      .s{stroke:#e8e4d8}.a{stroke:#b89be8}.dg{stroke:#d97a7a}
      .facc{fill:#b89be8;opacity:0.14}.fs{fill:#1a1a24}
    }
  </style>
  <defs>
    <marker id="fah" markerWidth="9" markerHeight="8" refX="7" refY="3.5" orient="auto"><path d="M0,0 L8,3.5 L0,7 z" fill="#6028d9"/></marker>
  </defs>

  <rect x="0" y="0" width="800" height="360" class="fs"/>
  <text x="40" y="32" class="label">SUBMISSION → COMPLETION · FILL, PUBLISH, NOTIFY, EXECUTE, POST, REAP</text>

  <!-- ===== TOP ROW ===== -->
  <!-- step 1 -->
  <rect x="40" y="72" width="210" height="66" rx="5" class="s"/>
  <circle cx="40" cy="72" r="13" class="acc"/>
  <text x="40" y="76" text-anchor="middle" class="fs" style="font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:700">1</text>
  <text x="60" y="102" class="text" style="font-weight:700">FILL SQE(s)</text>
  <text x="60" y="122" class="mono" style="font-size:10px">describe ops: read/write/fsync</text>

  <!-- step 2 -->
  <rect x="290" y="72" width="210" height="66" rx="5" class="s"/>
  <circle cx="290" cy="72" r="13" class="acc"/>
  <text x="290" y="76" text-anchor="middle" class="fs" style="font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:700">2</text>
  <text x="310" y="102" class="text" style="font-weight:700">ADVANCE SQ TAIL</text>
  <text x="310" y="122" class="mono" style="font-size:10px">publish entries to the ring</text>

  <!-- step 3 -->
  <rect x="540" y="72" width="210" height="66" rx="5" class="facc"/>
  <rect x="540" y="72" width="210" height="66" rx="5" class="a"/>
  <circle cx="540" cy="72" r="13" class="acc"/>
  <text x="540" y="76" text-anchor="middle" class="fs" style="font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:700">3</text>
  <text x="560" y="102" class="acc" style="font-weight:700">io_uring_enter()</text>
  <text x="560" y="122" class="mono" style="font-size:10px">or SQPOLL picks up — no syscall</text>

  <!-- ===== BOTTOM ROW ===== -->
  <!-- step 4 -->
  <rect x="540" y="216" width="210" height="66" rx="5" class="s"/>
  <circle cx="540" cy="216" r="13" class="acc"/>
  <text x="540" y="220" text-anchor="middle" class="fs" style="font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:700">4</text>
  <text x="560" y="246" class="text" style="font-weight:700">KERNEL EXECUTES</text>
  <text x="560" y="266" class="mono" style="font-size:10px">asynchronously, off your thread</text>

  <!-- step 5 -->
  <rect x="290" y="216" width="210" height="66" rx="5" class="s"/>
  <circle cx="290" cy="216" r="13" class="acc"/>
  <text x="290" y="220" text-anchor="middle" class="fs" style="font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:700">5</text>
  <text x="310" y="246" class="text" style="font-weight:700">POST CQE(s)</text>
  <text x="310" y="266" class="mono" style="font-size:10px">one completion per finished op</text>

  <!-- step 6 -->
  <rect x="40" y="216" width="210" height="66" rx="5" class="s"/>
  <circle cx="40" cy="216" r="13" class="acc"/>
  <text x="40" y="220" text-anchor="middle" class="fs" style="font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:700">6</text>
  <text x="60" y="246" class="text" style="font-weight:700">REAP CQE</text>
  <text x="60" y="266" class="mono" style="font-size:10px">from CQ head; tag → result</text>

  <!-- arrows -->
  <path d="M250 105 L286 105" class="a" marker-end="url(#fah)"/>
  <path d="M500 105 L536 105" class="a" marker-end="url(#fah)"/>
  <path d="M645 138 L645 212" class="a" marker-end="url(#fah)"/>
  <path d="M540 249 L504 249" class="a" marker-end="url(#fah)"/>
  <path d="M290 249 L254 249" class="a" marker-end="url(#fah)"/>

  <text x="400" y="330" text-anchor="middle" class="label">SUBMISSION AND COMPLETION ARE DECOUPLED IN TIME — YOU REAP AT YOUR OWN PACE</text>
</svg>
