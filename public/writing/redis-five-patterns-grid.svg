<svg viewBox="0 0 800 380" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-redis-grid">
  <title id="t-redis-grid">Five Redis patterns: one daemon, five components</title>
  <style>
    .text{fill:#1a1a24;font-family:Inter,system-ui,sans-serif;font-size:12.5px}
    .label{fill:#5c5c66;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:10.5px;letter-spacing:.08em}
    .mono{fill:#1a1a24;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11px}
    .acc{fill:#6028d9;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11px}
    .s{stroke:#1a1a24;fill:none;stroke-width:1.25}
    .sm{stroke:#b3b3bd;fill:none;stroke-width:1;stroke-dasharray:4 4}
    .a{stroke:#6028d9;fill:none;stroke-width:1.5}
    .fa{fill:#6028d9}
    .fs{fill:#f5f1e6}
    @media (prefers-color-scheme: dark){
      .text{fill:#e8e4d8}.label{fill:#9c9ca6}.mono{fill:#e8e4d8}.acc{fill:#b89be8}
      .s{stroke:#e8e4d8}.sm{stroke:#4a4a55}.a{stroke:#b89be8}.fa{fill:#b89be8}.fs{fill:#1a1a24}
    }
  </style>

  <text x="40" y="36" class="label">ONE DAEMON · FIVE COMPONENTS YOU DON'T HAVE TO RUN</text>

  <!-- Center: cache -->
  <rect x="320" y="160" width="160" height="80" rx="4" class="fs"/>
  <rect x="320" y="160" width="160" height="80" rx="4" class="a"/>
  <text x="400" y="188" text-anchor="middle" class="acc">CACHE</text>
  <text x="400" y="208" text-anchor="middle" class="mono">GET / SET EX</text>
  <text x="400" y="226" text-anchor="middle" class="text">the obvious one</text>

  <!-- Top-left: rate limit -->
  <rect x="60" y="60" width="200" height="80" rx="4" class="s"/>
  <text x="160" y="86" text-anchor="middle" class="acc">RATE LIMIT</text>
  <text x="160" y="106" text-anchor="middle" class="mono">INCR + EXPIRE NX</text>
  <text x="160" y="124" text-anchor="middle" class="text">fixed window per minute</text>

  <!-- Top-right: distributed lock -->
  <rect x="540" y="60" width="200" height="80" rx="4" class="s"/>
  <text x="640" y="86" text-anchor="middle" class="acc">DISTRIBUTED LOCK</text>
  <text x="640" y="106" text-anchor="middle" class="mono">SET NX EX + token</text>
  <text x="640" y="124" text-anchor="middle" class="text">Lua release · fencing</text>

  <!-- Bottom-left: idempotency -->
  <rect x="60" y="260" width="200" height="80" rx="4" class="s"/>
  <text x="160" y="286" text-anchor="middle" class="acc">IDEMPOTENCY</text>
  <text x="160" y="306" text-anchor="middle" class="mono">SET NX + body hash</text>
  <text x="160" y="324" text-anchor="middle" class="text">cached replay response</text>

  <!-- Bottom-center: session -->
  <rect x="320" y="280" width="160" height="60" rx="4" class="s"/>
  <text x="400" y="304" text-anchor="middle" class="acc">SESSIONS</text>
  <text x="400" y="324" text-anchor="middle" class="mono">SET EX · GETEX</text>

  <!-- Bottom-right: job queue -->
  <rect x="540" y="260" width="200" height="80" rx="4" class="s"/>
  <text x="640" y="286" text-anchor="middle" class="acc">JOB QUEUE</text>
  <text x="640" y="306" text-anchor="middle" class="mono">LPUSH · BLMOVE · LREM</text>
  <text x="640" y="324" text-anchor="middle" class="text">at-least-once · crash-safe</text>

  <!-- Connecting lines from center -->
  <line x1="320" y1="180" x2="260" y2="100" class="sm"/>
  <line x1="480" y1="180" x2="540" y2="100" class="sm"/>
  <line x1="320" y1="220" x2="260" y2="300" class="sm"/>
  <line x1="400" y1="240" x2="400" y2="280" class="sm"/>
  <line x1="480" y1="220" x2="540" y2="300" class="sm"/>

  <text x="400" y="368" text-anchor="middle" class="label">EACH REPLACES A COMPONENT YOU'D OTHERWISE DEPLOY</text>
</svg>
