<svg viewBox="0 0 800 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-senior-hour">
  <title id="t-senior-hour">Where a senior engineer's hour goes, before vs after AI coding assistance</title>
  <style>
    .text{fill:#1a1a24;font-family:Inter,system-ui,sans-serif;font-size:13px}
    .label{fill:#5c5c66;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:10.5px;letter-spacing:.08em}
    .mono{fill:#1a1a24;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11.5px}
    .acc{fill:#6028d9;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11px}
    .s{stroke:#1a1a24;fill:none;stroke-width:1.25}
    .sm{stroke:#b3b3bd;fill:none;stroke-width:1;stroke-dasharray:4 4}
    .a{stroke:#6028d9;fill:none;stroke-width:1.5}
    .fa{fill:#6028d9}
    .fs{fill:#f5f1e6}
    @media (prefers-color-scheme: dark){
      .text{fill:#e8e4d8}.label{fill:#9c9ca6}.mono{fill:#e8e4d8}.acc{fill:#b89be8}
      .s{stroke:#e8e4d8}.sm{stroke:#4a4a55}.a{stroke:#b89be8}.fa{fill:#b89be8}.fs{fill:#1a1a24}
    }
  </style>

  <text x="40" y="36" class="label">A SENIOR HOUR · BEFORE AND AFTER · BARS = SHARE OF TIME</text>

  <text x="40" y="76" class="label">BEFORE · ~2022</text>

  <text x="40" y="104" class="mono">Writing code</text>
  <rect x="190" y="92" width="380" height="16" rx="2" class="s"/>
  <text x="580" y="104" class="label">55%</text>

  <text x="40" y="132" class="mono">Reading / reviewing</text>
  <rect x="190" y="120" width="100" height="16" rx="2" class="s"/>
  <text x="300" y="132" class="label">15%</text>

  <text x="40" y="160" class="mono">Meetings / aligning</text>
  <rect x="190" y="148" width="100" height="16" rx="2" class="s"/>
  <text x="300" y="160" class="label">15%</text>

  <text x="40" y="188" class="mono">Design + thinking</text>
  <rect x="190" y="176" width="70" height="16" rx="2" class="s"/>
  <text x="270" y="188" class="label">10%</text>

  <text x="40" y="216" class="mono">Mentoring</text>
  <rect x="190" y="204" width="35" height="16" rx="2" class="s"/>
  <text x="235" y="216" class="label">5%</text>

  <line x1="40" y1="240" x2="760" y2="240" class="sm"/>

  <text x="40" y="262" class="acc">AFTER · 2026</text>

  <text x="40" y="290" class="mono">Reviewing AI + human PRs</text>
  <rect x="190" y="278" width="240" height="16" rx="2" class="fs"/>
  <rect x="190" y="278" width="240" height="16" rx="2" class="a"/>
  <text x="440" y="290" class="acc">35%</text>

  <text x="40" y="318" class="mono">Writing code (smaller, harder)</text>
  <rect x="190" y="306" width="140" height="16" rx="2" class="fs"/>
  <rect x="190" y="306" width="140" height="16" rx="2" class="a"/>
  <text x="340" y="318" class="acc">20%</text>

  <text x="40" y="346" class="mono">Design + framing + mentoring + evals</text>
  <rect x="270" y="334" width="320" height="16" rx="2" class="fs"/>
  <rect x="270" y="334" width="320" height="16" rx="2" class="a"/>
  <text x="600" y="346" class="acc">45%</text>
</svg>
