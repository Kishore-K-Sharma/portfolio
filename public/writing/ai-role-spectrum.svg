<svg viewBox="0 0 800 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-ai-roles">
  <title id="t-ai-roles">The three AI roles, and which one most "AI engineer" jobs actually are</title>
  <style>
    .text{fill:#1a1a24;font-family:Inter,system-ui,sans-serif;font-size:13px}
    .label{fill:#5c5c66;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:10.5px;letter-spacing:.08em}
    .mono{fill:#1a1a24;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11.5px}
    .acc{fill:#6028d9;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11px}
    .s{stroke:#1a1a24;fill:none;stroke-width:1.25}
    .sm{stroke:#b3b3bd;fill:none;stroke-width:1;stroke-dasharray:4 4}
    .a{stroke:#6028d9;fill:none;stroke-width:1.5}
    .fs{fill:#f5f1e6}
    @media (prefers-color-scheme: dark){
      .text{fill:#e8e4d8}.label{fill:#9c9ca6}.mono{fill:#e8e4d8}.acc{fill:#b89be8}
      .s{stroke:#e8e4d8}.sm{stroke:#4a4a55}.a{stroke:#b89be8}.fs{fill:#1a1a24}
    }
  </style>

  <text x="40" y="36" class="label">"AI ENGINEER" IS THREE DIFFERENT JOBS · MOST OPENINGS ARE ONE OF THEM</text>

  <rect x="40" y="80" width="220" height="220" rx="4" class="s"/>
  <text x="150" y="106" text-anchor="middle" class="acc">AI RESEARCHER</text>
  <text x="150" y="124" text-anchor="middle" class="label">~5% OF OPENINGS</text>
  <line x1="60" y1="138" x2="240" y2="138" class="sm"/>
  <text x="60" y="160" class="text">Designs new models</text>
  <text x="60" y="178" class="text">Publishes papers</text>
  <text x="60" y="196" class="text">PhD + research lab</text>
  <text x="60" y="224" class="label">NEEDS</text>
  <text x="60" y="244" class="mono">deep math · novel</text>
  <text x="60" y="262" class="mono">architectures · GPUs</text>
  <text x="60" y="288" class="label">NOT YOUR PATH</text>

  <rect x="290" y="80" width="220" height="220" rx="4" class="s"/>
  <text x="400" y="106" text-anchor="middle" class="acc">ML ENGINEER</text>
  <text x="400" y="124" text-anchor="middle" class="label">~25% OF OPENINGS</text>
  <line x1="310" y1="138" x2="490" y2="138" class="sm"/>
  <text x="310" y="160" class="text">Trains + serves</text>
  <text x="310" y="178" class="text">in-house models</text>
  <text x="310" y="196" class="text">Owns pipelines</text>
  <text x="310" y="224" class="label">NEEDS</text>
  <text x="310" y="244" class="mono">PyTorch · feature</text>
  <text x="310" y="262" class="mono">stores · MLOps</text>
  <text x="310" y="288" class="label">PARTIAL TRANSFER</text>

  <rect x="540" y="80" width="220" height="220" rx="4" class="fs"/>
  <rect x="540" y="80" width="220" height="220" rx="4" class="a"/>
  <text x="650" y="106" text-anchor="middle" class="acc">AI ENGINEER (APPLIED)</text>
  <text x="650" y="124" text-anchor="middle" class="label">~70% OF OPENINGS</text>
  <line x1="560" y1="138" x2="740" y2="138" class="sm"/>
  <text x="560" y="160" class="text">Ships LLM features</text>
  <text x="560" y="178" class="text">RAG, agents, evals</text>
  <text x="560" y="196" class="text">Calls APIs, integrates</text>
  <text x="560" y="224" class="label">NEEDS</text>
  <text x="560" y="244" class="mono">backend skills +</text>
  <text x="560" y="262" class="mono">LLM mental model</text>
  <text x="560" y="288" class="acc">→ YOUR PATH</text>

  <text x="400" y="338" text-anchor="middle" class="label">BACKEND ENGINEERS HAVE 80% OF WHAT THE APPLIED ROLE NEEDS · THE GAP IS NARROW</text>
</svg>
