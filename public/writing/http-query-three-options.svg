<svg viewBox="0 0 800 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-q3">
  <title id="t-q3">Three ways to send a complex query</title>
  <style>
    .text{fill:#1a1a24;font-family:Inter,system-ui,sans-serif;font-size:12.5px}
    .label{fill:#5c5c66;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:10.5px;letter-spacing:.08em}
    .acc{fill:#6028d9;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11px}
    .danger{fill:#c14545;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11px}
    .warn{fill:#5c5c66;font-family:Inter,system-ui,sans-serif;font-size:12.5px}
    .s{stroke:#1a1a24;fill:none;stroke-width:1.25}
    .a{stroke:#6028d9;fill:none;stroke-width:1.5}
    .dg{stroke:#c14545;fill:none;stroke-width:1.25}
    .fs{fill:#f5f1e6}
    @media (prefers-color-scheme: dark){
      .text{fill:#e8e4d8}.label{fill:#9c9ca6}.acc{fill:#b89be8}.danger{fill:#d97a7a}.warn{fill:#9c9ca6}
      .s{stroke:#e8e4d8}.a{stroke:#b89be8}.dg{stroke:#d97a7a}.fs{fill:#1a1a24}
    }
  </style>

  <rect x="0" y="0" width="800" height="360" class="fs"/>
  <text x="40" y="34" class="label">ONE COMPLEX QUERY · THREE WAYS TO SEND IT</text>

  <!-- GET in URL -->
  <rect x="40" y="60" width="230" height="240" rx="4" class="dg"/>
  <text x="58" y="88" class="danger">GET ?filter=…</text>
  <line x1="58" y1="100" x2="252" y2="100" class="dg" stroke-dasharray="4 4"/>
  <text x="58" y="126" class="text">query jammed in the URL</text>
  <text x="58" y="152" class="danger">✕ URL length wall (414)</text>
  <text x="58" y="176" class="danger">✕ leaks into logs + history</text>
  <text x="58" y="200" class="danger">✕ hand-rolled encoding</text>
  <text x="58" y="234" class="text">✓ safe · ✓ cacheable</text>
  <text x="58" y="278" class="danger">FINE UNTIL IT ISN'T</text>

  <!-- POST -->
  <rect x="285" y="60" width="230" height="240" rx="4" class="s"/>
  <text x="303" y="88" class="text" style="font-weight:700">POST /search</text>
  <line x1="303" y1="100" x2="497" y2="100" class="s" stroke-dasharray="4 4"/>
  <text x="303" y="126" class="text">body carries the query</text>
  <text x="303" y="152" class="text">✓ any size, no leak</text>
  <text x="303" y="176" class="danger">✕ not safe</text>
  <text x="303" y="200" class="danger">✕ not idempotent</text>
  <text x="303" y="234" class="danger">✕ uncacheable · no retry</text>
  <text x="303" y="278" class="warn">A READ WEARING A WRITE'S COAT</text>

  <!-- QUERY -->
  <rect x="530" y="60" width="230" height="240" rx="4" class="a"/>
  <text x="548" y="88" class="acc">QUERY /search</text>
  <line x1="548" y1="100" x2="742" y2="100" class="a" stroke-dasharray="4 4"/>
  <text x="548" y="126" class="text">body carries the query</text>
  <text x="548" y="152" class="text">✓ any size, no leak</text>
  <text x="548" y="176" class="acc">✓ safe</text>
  <text x="548" y="200" class="acc">✓ idempotent</text>
  <text x="548" y="234" class="acc">✓ cacheable (on the body)</text>
  <text x="548" y="278" class="acc">THE HONEST READ</text>

  <text x="40" y="344" class="label">GET LEAKS · POST LIES · QUERY TELLS THE INFRASTRUCTURE THE TRUTH</text>
</svg>
