<svg viewBox="0 0 800 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-aml">
  <title id="t-aml">Per-task microVM lifecycle: spawn, run under limits, collect result, destroy</title>
  <style>
    .text{fill:#1a1a24;font-family:Inter,system-ui,sans-serif;font-size:12.5px}
    .label{fill:#5c5c66;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:10.5px;letter-spacing:.08em}
    .mono{fill:#1a1a24;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11px}
    .acc{fill:#6028d9;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11px}
    .danger{fill:#c14545;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11px}
    .s{stroke:#1a1a24;fill:none;stroke-width:1.25}
    .a{stroke:#6028d9;fill:none;stroke-width:1.5}
    .dg{stroke:#c14545;fill:none;stroke-width:1.25}
    .fdgc{fill:#c14545;opacity:0.12}
    .fs{fill:#f5f1e6}
    @media (prefers-color-scheme: dark){
      .text{fill:#e8e4d8}.label{fill:#9c9ca6}.mono{fill:#e8e4d8}.acc{fill:#b89be8}.danger{fill:#d97a7a}
      .s{stroke:#e8e4d8}.a{stroke:#b89be8}.dg{stroke:#d97a7a}.fdgc{fill:#d97a7a;opacity:0.16}.fs{fill:#1a1a24}
    }
  </style>

  <rect x="0" y="0" width="800" height="360" class="fs"/>
  <text x="40" y="32" class="label">microVM LIFECYCLE · ONE SANDBOX PER TASK · DESTROY AFTER</text>

  <!-- step 1: task arrives -->
  <rect x="40" y="70" width="150" height="66" rx="4" class="s"/>
  <text x="56" y="92" class="label">STEP 1</text>
  <text x="56" y="114" class="text" style="font-weight:700">TASK ARRIVES</text>
  <text x="56" y="130" class="mono">run code / tests</text>

  <!-- step 2: spawn -->
  <rect x="230" y="70" width="170" height="66" rx="4" class="a"/>
  <text x="246" y="92" class="label">STEP 2</text>
  <text x="246" y="114" class="text" style="font-weight:700">SPAWN microVM</text>
  <text x="246" y="130" class="acc">or RESTORE snapshot</text>

  <!-- step 3: run under limits -->
  <rect x="440" y="70" width="180" height="66" rx="4" class="a"/>
  <text x="456" y="92" class="label">STEP 3</text>
  <text x="456" y="114" class="text" style="font-weight:700">RUN UNDER LIMITS</text>
  <text x="456" y="130" class="mono">CPU·mem·pids·time</text>

  <!-- step 4: collect -->
  <rect x="440" y="200" width="180" height="66" rx="4" class="s"/>
  <text x="456" y="222" class="label">STEP 4</text>
  <text x="456" y="244" class="text" style="font-weight:700">COLLECT RESULT</text>
  <text x="456" y="260" class="mono">treat as untrusted</text>

  <!-- step 5: destroy -->
  <rect x="230" y="200" width="170" height="66" rx="4" class="dg"/>
  <rect x="230" y="200" width="170" height="66" rx="4" class="fdgc"/>
  <text x="246" y="222" class="label">STEP 5</text>
  <text x="246" y="244" class="danger">DESTROY VM</text>
  <text x="246" y="260" class="mono">no state survives</text>

  <!-- arrows -->
  <line x1="190" y1="103" x2="226" y2="103" class="s"/>
  <polygon points="226,103 218,99 218,107" class="s" fill="currentColor"/>
  <line x1="400" y1="103" x2="436" y2="103" class="s"/>
  <polygon points="436,103 428,99 428,107" class="s" fill="currentColor"/>
  <line x1="530" y1="136" x2="530" y2="196" class="s"/>
  <polygon points="530,196 526,188 534,188" class="s" fill="currentColor"/>
  <line x1="440" y1="233" x2="404" y2="233" class="s"/>
  <polygon points="404,233 412,229 412,237" class="s" fill="currentColor"/>

  <!-- loop back arrow -->
  <path d="M 230 233 C 100 233, 100 103, 40 103" class="a" fill="none" stroke-dasharray="5 4"/>
  <polygon points="40,103 50,99 50,107" class="a" fill="currentColor"/>
  <text x="66" y="180" class="acc">next task → fresh VM</text>

  <text x="40" y="320" class="text" style="font-weight:700">Per-task disposability:</text>
  <text x="190" y="320" class="text">nothing carries into the next task — no cross-task state, no neighbor to poison.</text>
</svg>
