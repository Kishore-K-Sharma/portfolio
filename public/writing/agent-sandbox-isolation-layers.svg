<svg viewBox="0 0 800 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-ail">
  <title id="t-ail">Isolation spectrum: process to container to gVisor to microVM to full VM</title>
  <style>
    .text{fill:#1a1a24;font-family:Inter,system-ui,sans-serif;font-size:12.5px}
    .label{fill:#5c5c66;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:10.5px;letter-spacing:.08em}
    .mono{fill:#1a1a24;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11px}
    .acc{fill:#6028d9;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11px}
    .danger{fill:#c14545;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11px}
    .s{stroke:#1a1a24;fill:none;stroke-width:1.25}
    .a{stroke:#6028d9;fill:none;stroke-width:1.5}
    .dg{stroke:#c14545;fill:none;stroke-width:1.25}
    .fdgc{fill:#c14545;opacity:0.12}
    .fs{fill:#f5f1e6}
    @media (prefers-color-scheme: dark){
      .text{fill:#e8e4d8}.label{fill:#9c9ca6}.mono{fill:#e8e4d8}.acc{fill:#b89be8}.danger{fill:#d97a7a}
      .s{stroke:#e8e4d8}.a{stroke:#b89be8}.dg{stroke:#d97a7a}.fdgc{fill:#d97a7a;opacity:0.16}.fs{fill:#1a1a24}
    }
  </style>

  <rect x="0" y="0" width="800" height="360" class="fs"/>
  <text x="40" y="30" class="label">THE ISOLATION SPECTRUM · SURFACE SHRINKS ↑ · COST GROWS →</text>

  <!-- rungs -->
  <!-- rung 1 -->
  <rect x="40" y="250" width="120" height="70" rx="4" class="dg"/>
  <text x="52" y="272" class="text" style="font-weight:700">PROCESS</text>
  <text x="52" y="290" class="mono">seccomp ·</text>
  <text x="52" y="304" class="mono">setuid</text>
  <text x="52" y="242" class="danger">weak</text>

  <!-- rung 2 -->
  <rect x="180" y="212" width="120" height="70" rx="4" class="dg"/>
  <text x="192" y="234" class="text" style="font-weight:700">CONTAINER</text>
  <text x="192" y="252" class="mono">namespaces</text>
  <text x="192" y="266" class="mono">SHARES kernel</text>

  <!-- rung 3 -->
  <rect x="320" y="164" width="120" height="70" rx="4" class="a"/>
  <text x="332" y="186" class="text" style="font-weight:700">gVISOR</text>
  <text x="332" y="204" class="mono">user-space</text>
  <text x="332" y="218" class="mono">kernel (Go)</text>

  <!-- rung 4 -->
  <rect x="460" y="116" width="130" height="70" rx="4" class="a"/>
  <text x="472" y="138" class="text" style="font-weight:700">microVM</text>
  <text x="472" y="156" class="mono">Firecracker ·</text>
  <text x="472" y="170" class="mono">own kernel ·125ms</text>

  <!-- rung 5 -->
  <rect x="610" y="68" width="120" height="70" rx="4" class="s"/>
  <text x="622" y="90" class="text" style="font-weight:700">FULL VM</text>
  <text x="622" y="108" class="mono">heaviest ·</text>
  <text x="622" y="122" class="mono">max compat</text>
  <text x="622" y="60" class="acc">strong</text>

  <!-- climbing arrow -->
  <line x1="55" y1="250" x2="700" y2="80" class="s" stroke-dasharray="3 4"/>

  <!-- security boundary marker -->
  <line x1="310" y1="150" x2="310" y2="330" class="dg" stroke-dasharray="6 4"/>
  <text x="150" y="348" class="danger">← NOT a boundary vs hostile code</text>
  <text x="430" y="348" class="acc">real security boundary starts here →</text>
</svg>
