<svg viewBox="0 0 800 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-hook-matrix">
  <title id="t-hook-matrix">Hook shape matrix: stateful vs stateless, block vs observe</title>
  <style>
    .text{fill:#1a1a24;font-family:Inter,system-ui,sans-serif;font-size:12.5px}
    .label{fill:#5c5c66;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:10.5px;letter-spacing:.08em}
    .mono{fill:#1a1a24;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11.5px}
    .acc{fill:#6028d9;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11px}
    .danger{fill:#c14545;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:10.5px;letter-spacing:.08em}
    .s{stroke:#1a1a24;fill:none;stroke-width:1.25}
    .sm{stroke:#b3b3bd;fill:none;stroke-width:1;stroke-dasharray:4 4}
    .a{stroke:#6028d9;fill:none;stroke-width:1.5}
    .dg{stroke:#c14545;fill:none;stroke-width:1.5}
    .fa{fill:#6028d9}
    .fd{fill:#c14545}
    .fs{fill:#f5f1e6}
    @media (prefers-color-scheme: dark){
      .text{fill:#e8e4d8}.label{fill:#9c9ca6}.mono{fill:#e8e4d8}.acc{fill:#b89be8}.danger{fill:#d97a7a}
      .s{stroke:#e8e4d8}.sm{stroke:#4a4a55}.a{stroke:#b89be8}.dg{stroke:#d97a7a}
      .fa{fill:#b89be8}.fd{fill:#d97a7a}.fs{fill:#1a1a24}
    }
  </style>

  <text x="40" y="36" class="label">HOOK SHAPE MATRIX · THREE OF FOUR QUADRANTS ARE SAFE</text>

  <!-- Axes -->
  <line x1="120" y1="80" x2="120" y2="300" class="s"/>
  <line x1="120" y1="190" x2="720" y2="190" class="s"/>

  <!-- Y-axis labels -->
  <text x="60" y="124" class="label">BLOCKS</text>
  <text x="60" y="138" class="label">LOOP</text>

  <text x="60" y="254" class="label">OBSERVES</text>
  <text x="60" y="268" class="label">ONLY</text>

  <!-- X-axis labels -->
  <text x="280" y="320" text-anchor="middle" class="label">STATELESS</text>
  <text x="560" y="320" text-anchor="middle" class="label">STATEFUL</text>

  <!-- Top-left: blocks + stateless -->
  <rect x="140" y="92" width="280" height="80" rx="3" class="a"/>
  <text x="160" y="116" class="acc">SAFE</text>
  <text x="160" y="138" class="mono">block-destructive</text>
  <text x="160" y="156" class="text">match pattern · exit 2 · done</text>

  <!-- Top-right: blocks + stateful -->
  <rect x="440" y="92" width="280" height="80" rx="3" class="dg"/>
  <text x="460" y="116" class="danger">USUALLY WRONG SHAPE</text>
  <text x="460" y="138" class="mono">"block if &gt; N events"</text>
  <text x="460" y="156" class="text">complexity bites · prefer stateless</text>

  <!-- Bottom-left: observes + stateless -->
  <rect x="140" y="210" width="280" height="80" rx="3" class="a"/>
  <text x="160" y="234" class="acc">SAFE</text>
  <text x="160" y="256" class="mono">format-on-write</text>
  <text x="160" y="274" class="mono">log-tool-use</text>

  <!-- Bottom-right: observes + stateful -->
  <rect x="440" y="210" width="280" height="80" rx="3" class="a"/>
  <text x="460" y="234" class="acc">SAFE — IF FAILS OPEN</text>
  <text x="460" y="256" class="mono">session-context</text>
  <text x="460" y="274" class="mono">cost-guardrail</text>

  <text x="400" y="350" text-anchor="middle" class="label">FAIL OPEN · ONE JOB PER HOOK · UNDER 25 LINES</text>
</svg>
