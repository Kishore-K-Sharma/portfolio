<svg viewBox="0 0 800 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-iso">
  <title id="t-iso">V8 isolate versus Node container</title>
  <style>
    .text{fill:#1a1a24;font-family:Inter,system-ui,sans-serif;font-size:12.5px}
    .label{fill:#5c5c66;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:10.5px;letter-spacing:.08em}
    .mono{fill:#1a1a24;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11px}
    .acc{fill:#6028d9;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11px}
    .danger{fill:#c14545;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11px}
    .s{stroke:#1a1a24;fill:none;stroke-width:1.25}
    .a{stroke:#6028d9;fill:none;stroke-width:1.5}
    .dg{stroke:#c14545;fill:none;stroke-width:1.25}
    .fs{fill:#f5f1e6}
    @media (prefers-color-scheme: dark){
      .text{fill:#e8e4d8}.label{fill:#9c9ca6}.mono{fill:#e8e4d8}.acc{fill:#b89be8}.danger{fill:#d97a7a}
      .s{stroke:#e8e4d8}.a{stroke:#b89be8}.dg{stroke:#d97a7a}.fs{fill:#1a1a24}
    }
  </style>

  <rect x="0" y="0" width="800" height="360" class="fs"/>
  <text x="40" y="34" class="label">TWO RUNTIMES · WHY COLD STARTS DIFFER</text>

  <!-- V8 ISOLATE (edge) -->
  <rect x="40" y="58" width="340" height="240" rx="4" class="a"/>
  <text x="58" y="86" class="acc">V8 ISOLATE · EDGE</text>
  <line x1="58" y1="98" x2="362" y2="98" class="a" stroke-dasharray="4 4"/>
  <text x="58" y="122" class="mono">Web APIs: fetch, Request/Response</text>
  <text x="58" y="144" class="mono">Web Crypto, URL, streams</text>
  <text x="58" y="176" class="acc">✓ boots in ~milliseconds</text>
  <text x="58" y="200" class="acc">✓ thousands share one host</text>
  <text x="58" y="224" class="danger">✕ no arbitrary npm / native modules</text>
  <text x="58" y="248" class="danger">✕ tight CPU + execution-time limits</text>
  <text x="58" y="284" class="acc">BOOTS BEFORE YOU BLINK</text>

  <!-- NODE CONTAINER (serverless) -->
  <rect x="420" y="58" width="340" height="240" rx="4" class="s"/>
  <text x="438" y="86" class="text" style="font-weight:700">NODE CONTAINER · SERVERLESS</text>
  <line x1="438" y1="98" x2="742" y2="98" class="s" stroke-dasharray="4 4"/>
  <text x="438" y="122" class="mono">full Node.js + entire npm</text>
  <text x="438" y="144" class="mono">native modules, raw TCP sockets</text>
  <text x="438" y="176" class="text">✓ more memory / CPU / time</text>
  <text x="438" y="200" class="text">✓ open a real Postgres socket</text>
  <text x="438" y="224" class="danger">✕ heavier cold start (spin a sandbox)</text>
  <text x="438" y="248" class="danger">✕ one region, slower to wake</text>
  <text x="438" y="284" class="text" style="font-weight:700">THE HEAVY MACHINERY</text>

  <text x="40" y="344" class="label">ISOLATES SHARE A RUNTIME · CONTAINERS SPIN A WHOLE SANDBOX — THAT'S THE COLD-START GAP</text>
</svg>
