<svg viewBox="0 0 800 380" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-ctx-budget">
  <title id="t-ctx-budget">The context window as a finite stacked token budget, with conversation history as the first slice evicted</title>
  <style>
    .text{fill:#1a1a24;font-family:Inter,system-ui,sans-serif;font-size:13px}
    .label{fill:#5c5c66;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:10.5px;letter-spacing:.08em}
    .mono{fill:#1a1a24;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11.5px}
    .acc{fill:#6028d9;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11px}
    .danger{fill:#c14545;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:10.5px;letter-spacing:.08em}
    .s{stroke:#1a1a24;fill:none;stroke-width:1.25}
    .sm{stroke:#b3b3bd;fill:none;stroke-width:1;stroke-dasharray:4 4}
    .a{stroke:#6028d9;fill:none;stroke-width:1.5}
    .dg{stroke:#c14545;fill:none;stroke-width:1.25}
    .fa{fill:#6028d9}
    .fd{fill:#c14545}
    .fs{fill:#f5f1e6}
    @media (prefers-color-scheme: dark){
      .text{fill:#e8e4d8}.label{fill:#9c9ca6}.mono{fill:#e8e4d8}.acc{fill:#b89be8}.danger{fill:#d97a7a}
      .s{stroke:#e8e4d8}.sm{stroke:#4a4a55}.a{stroke:#b89be8}.dg{stroke:#d97a7a}
      .fa{fill:#b89be8}.fd{fill:#d97a7a}.fs{fill:#1a1a24}
    }
  </style>

  <text x="40" y="36" class="label">ONE CONTEXT WINDOW · FINITE TOKEN BUDGET · EVERYTHING COMPETES</text>

  <!-- The window: a single bounded column -->
  <rect x="120" y="60" width="240" height="290" rx="4" class="s"/>
  <text x="240" y="50" text-anchor="middle" class="label">CONTEXT WINDOW (HARD CEILING)</text>

  <!-- System instructions: bottom, small, resident -->
  <rect x="120" y="306" width="240" height="44" rx="4" class="fs"/>
  <rect x="120" y="306" width="240" height="44" rx="4" class="a"/>
  <text x="240" y="326" text-anchor="middle" class="acc">SYSTEM INSTRUCTIONS</text>
  <text x="240" y="342" text-anchor="middle" class="label">SMALL · ALWAYS RESIDENT</text>

  <!-- Tool definitions -->
  <rect x="120" y="262" width="240" height="44" rx="4" class="s"/>
  <text x="240" y="282" text-anchor="middle" class="mono">TOOL DEFINITIONS</text>
  <text x="240" y="298" text-anchor="middle" class="label">ALWAYS-ON OVERHEAD · TRIM IT</text>

  <!-- Retrieved knowledge -->
  <rect x="120" y="218" width="240" height="44" rx="4" class="s"/>
  <text x="240" y="238" text-anchor="middle" class="mono">RETRIEVED KNOWLEDGE</text>
  <text x="240" y="254" text-anchor="middle" class="label">RAG · JUST-IN-TIME · THE POINT</text>

  <!-- Conversation history: largest, least valuable -->
  <rect x="120" y="104" width="240" height="114" rx="4" class="s"/>
  <text x="240" y="150" text-anchor="middle" class="text">CONVERSATION HISTORY</text>
  <text x="240" y="168" text-anchor="middle" class="label">GROWS WITHOUT BOUND</text>
  <text x="240" y="184" text-anchor="middle" class="label">LEAST VALUE PER TOKEN</text>

  <!-- Current query at very top (high-attention) -->
  <rect x="120" y="60" width="240" height="44" rx="4" class="fs"/>
  <rect x="120" y="60" width="240" height="44" rx="4" class="a"/>
  <text x="240" y="80" text-anchor="middle" class="acc">CURRENT QUERY</text>
  <text x="240" y="96" text-anchor="middle" class="label">MUST FIT · HIGH ATTENTION</text>

  <!-- Eviction callout -->
  <line x1="360" y1="161" x2="470" y2="161" class="dg"/>
  <polygon points="470,161 460,156 460,166" class="fd"/>
  <text x="490" y="150" class="danger">EVICTED FIRST</text>
  <text x="490" y="168" class="text">when the query needs room,</text>
  <text x="490" y="186" class="text">oldest history drops off the</text>
  <text x="490" y="204" class="text">desk — newest turns kept.</text>

  <!-- Resident set callout -->
  <line x1="360" y1="284" x2="470" y2="284" class="a"/>
  <polygon points="470,284 460,279 460,289" class="fa"/>
  <text x="490" y="276" class="acc">HOT / RESIDENT SET</text>
  <text x="490" y="294" class="text">system + tools + retrieved</text>
  <text x="490" y="312" class="text">knowledge stay pinned, like</text>
  <text x="490" y="330" class="text">the hot keys in a cache.</text>

  <text x="400" y="372" text-anchor="middle" class="label">A FULL WINDOW IS NOT A SMART WINDOW · MANAGE IT LIKE AN LRU CACHE</text>
</svg>
