<svg viewBox="0 0 800 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-wtvs">
  <title id="t-wtvs">WebSocket over TCP versus WebTransport over QUIC</title>
  <style>
    .text{fill:#1a1a24;font-family:Inter,system-ui,sans-serif;font-size:12.5px}
    .label{fill:#5c5c66;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:10.5px;letter-spacing:.08em}
    .acc{fill:#6028d9;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11px}
    .danger{fill:#c14545;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11px}
    .warn{fill:#5c5c66;font-family:Inter,system-ui,sans-serif;font-size:12.5px}
    .s{stroke:#1a1a24;fill:none;stroke-width:1.25}
    .a{stroke:#6028d9;fill:none;stroke-width:1.5}
    .dg{stroke:#c14545;fill:none;stroke-width:1.25}
    .fs{fill:#f5f1e6}
    @media (prefers-color-scheme: dark){
      .text{fill:#e8e4d8}.label{fill:#9c9ca6}.acc{fill:#b89be8}.danger{fill:#d97a7a}.warn{fill:#9c9ca6}
      .s{stroke:#e8e4d8}.a{stroke:#b89be8}.dg{stroke:#d97a7a}.fs{fill:#1a1a24}
    }
  </style>

  <rect x="0" y="0" width="800" height="360" class="fs"/>
  <text x="40" y="34" class="label">ONE ORDERED PIPE · VS · A BUNDLE OF INDEPENDENT PIPES</text>

  <!-- WebSocket / TCP -->
  <rect x="40" y="60" width="330" height="240" rx="4" class="dg"/>
  <text x="58" y="88" class="danger">WEBSOCKET · over TCP</text>
  <line x1="58" y1="100" x2="352" y2="100" class="dg" stroke-dasharray="4 4"/>

  <line x1="58" y1="128" x2="352" y2="128" class="dg"/>
  <text x="58" y="122" class="text">one stream, strictly ordered</text>

  <text x="58" y="164" class="danger">✕ head-of-line blocking</text>
  <text x="58" y="188" class="danger">✕ one lost packet stalls all</text>
  <text x="58" y="212" class="danger">✕ single reliable stream only</text>
  <text x="58" y="236" class="text">✓ simple send / onmessage</text>
  <text x="58" y="278" class="danger">EVERYTHING WAITS IN LINE</text>

  <!-- WebTransport / QUIC -->
  <rect x="430" y="60" width="330" height="240" rx="4" class="a"/>
  <text x="448" y="88" class="acc">WEBTRANSPORT · over QUIC / UDP</text>
  <line x1="448" y1="100" x2="742" y2="100" class="a" stroke-dasharray="4 4"/>

  <line x1="448" y1="122" x2="742" y2="122" class="a"/>
  <line x1="448" y1="132" x2="742" y2="132" class="a"/>
  <line x1="448" y1="142" x2="742" y2="142" class="a"/>
  <text x="448" y="164" class="text">many independent streams</text>

  <text x="448" y="192" class="acc">✓ no cross-stream HOL blocking</text>
  <text x="448" y="216" class="acc">✓ per-stream ordering</text>
  <text x="448" y="240" class="acc">+ unreliable datagrams (lossy lane)</text>
  <text x="448" y="278" class="acc">LOSS ON A DOESN'T STALL B</text>

  <text x="40" y="344" class="label">WEBSOCKET = ONE PIPE · WEBTRANSPORT = MANY PIPES + A LOSSY EXPRESS LANE</text>
</svg>
