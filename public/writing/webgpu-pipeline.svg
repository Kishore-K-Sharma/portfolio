<svg viewBox="0 0 800 380" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-wpl">
  <title id="t-wpl">The WebGPU object graph</title>
  <style>
    .text{fill:#1a1a24;font-family:Inter,system-ui,sans-serif;font-size:12px}
    .label{fill:#5c5c66;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:10.5px;letter-spacing:.08em}
    .mono{fill:#1a1a24;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:12px}
    .acc{fill:#6028d9;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:12px}
    .s{stroke:#1a1a24;fill:none;stroke-width:1.25}
    .a{stroke:#6028d9;fill:none;stroke-width:1.5}
    .fs{fill:#f5f1e6}
    @media (prefers-color-scheme: dark){
      .text{fill:#e8e4d8}.label{fill:#9c9ca6}.mono{fill:#e8e4d8}.acc{fill:#b89be8}
      .s{stroke:#e8e4d8}.a{stroke:#b89be8}.fs{fill:#1a1a24}
    }
  </style>

  <rect x="0" y="0" width="800" height="380" class="fs"/>
  <text x="40" y="32" class="label">BUILD EXPLICIT OBJECTS UP FRONT — NOT ONE-OFF DRAW CALLS</text>

  <!-- BUILD ONCE band -->
  <text x="40" y="60" class="acc">BUILD ONCE</text>

  <rect x="40" y="74" width="150" height="46" rx="4" class="s"/>
  <text x="58" y="96" class="mono">Buffers</text>
  <text x="58" y="112" class="label">DATA ON THE GPU</text>

  <rect x="40" y="130" width="150" height="46" rx="4" class="s"/>
  <text x="58" y="152" class="mono">WGSL shaders</text>
  <text x="58" y="168" class="label">CODE THE GPU RUNS</text>

  <!-- arrows into pipeline -->
  <line x1="190" y1="97" x2="248" y2="118" class="a"/>
  <line x1="190" y1="153" x2="248" y2="132" class="a"/>

  <rect x="250" y="88" width="160" height="74" rx="4" class="a"/>
  <text x="268" y="118" class="acc" style="font-weight:700">Pipeline</text>
  <text x="268" y="140" class="label">SHADERS + CONFIG,</text>
  <text x="268" y="154" class="label">REUSABLE</text>

  <line x1="410" y1="125" x2="468" y2="125" class="a"/>

  <rect x="470" y="88" width="160" height="74" rx="4" class="a"/>
  <text x="488" y="118" class="acc" style="font-weight:700">Bind groups</text>
  <text x="488" y="140" class="label">HOW RESOURCES</text>
  <text x="488" y="154" class="label">ATTACH</text>

  <!-- SUBMIT band -->
  <text x="40" y="228" class="acc">SUBMIT (PER FRAME / PER DISPATCH)</text>

  <rect x="40" y="244" width="210" height="70" rx="4" class="s"/>
  <text x="58" y="276" class="mono">Command encoder</text>
  <text x="58" y="298" class="label">RECORD THE COMMANDS</text>

  <line x1="250" y1="279" x2="298" y2="279" class="a"/>
  <text x="252" y="270" class="label">encode</text>

  <rect x="300" y="244" width="200" height="70" rx="4" class="a"/>
  <text x="318" y="276" class="acc">queue.submit()</text>
  <text x="318" y="298" class="label">HAND IT TO THE GPU</text>

  <line x1="500" y1="279" x2="548" y2="279" class="a"/>

  <rect x="550" y="244" width="210" height="70" rx="4" class="a"/>
  <text x="568" y="276" class="acc" style="font-weight:700">GPU</text>
  <text x="568" y="298" class="label">RUNS THE RECORDED WORK</text>

  <!-- link between bands -->
  <line x1="550" y1="162" x2="550" y2="244" class="a" stroke-dasharray="4 4"/>
  <text x="560" y="205" class="label">PIPELINE + BINDINGS FEED THE ENCODER</text>

  <text x="40" y="360" class="label">SET UP ONCE · REPLAY CHEAPLY · THE DRIVER VALIDATES UP FRONT, NOT PER CALL</text>
</svg>
