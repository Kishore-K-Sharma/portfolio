<svg viewBox="0 0 800 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-trace-wf">
  <title id="t-trace-wf">One trace as a waterfall — nested spans across five services, with the slow database call highlighted in red</title>
  <style>
    .text{fill:#1a1a24;font-family:Inter,system-ui,sans-serif;font-size:13px}
    .label{fill:#5c5c66;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:10.5px;letter-spacing:.08em}
    .mono{fill:#1a1a24;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11.5px}
    .acc{fill:#6028d9;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11px}
    .danger{fill:#c14545;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:10.5px;letter-spacing:.08em}
    .s{stroke:#1a1a24;fill:none;stroke-width:1.25}
    .sm{stroke:#b3b3bd;fill:none;stroke-width:1;stroke-dasharray:4 4}
    .a{stroke:#6028d9;fill:none;stroke-width:1.5}
    .dg{stroke:#c14545;fill:none;stroke-width:1.25}
    .fa{fill:#6028d9}
    .fd{fill:#c14545}
    .fs{fill:#f5f1e6}
    @media (prefers-color-scheme: dark){
      .text{fill:#e8e4d8}.label{fill:#9c9ca6}.mono{fill:#e8e4d8}.acc{fill:#b89be8}.danger{fill:#d97a7a}
      .s{stroke:#e8e4d8}.sm{stroke:#4a4a55}.a{stroke:#b89be8}.dg{stroke:#d97a7a}
      .fa{fill:#b89be8}.fd{fill:#d97a7a}.fs{fill:#1a1a24}
    }
  </style>

  <text x="40" y="34" class="label">ONE TRACE · trace_id 4bf92f3577b3 · TOTAL 2.10s</text>

  <!-- time axis -->
  <line x1="300" y1="56" x2="760" y2="56" class="sm"/>
  <text x="300" y="50" class="label">0s</text>
  <text x="525" y="50" text-anchor="middle" class="label">1s</text>
  <text x="760" y="50" text-anchor="end" class="label">2.1s</text>

  <!-- Row 1: root span, api gateway -->
  <text x="40" y="84" class="mono">api-gateway</text>
  <text x="40" y="99" class="label">SPAN · GET /checkout</text>
  <rect x="300" y="72" width="455" height="20" rx="4" class="s"/>
  <text x="310" y="86" class="mono">2.10s</text>

  <!-- Row 2: order-service -->
  <text x="64" y="124" class="mono">order-service</text>
  <text x="64" y="139" class="label">SPAN · createOrder</text>
  <rect x="320" y="112" width="410" height="20" rx="4" class="s"/>
  <text x="330" y="126" class="mono">1.95s</text>

  <!-- Row 3: payment-service -->
  <text x="88" y="164" class="mono">payment-service</text>
  <text x="88" y="179" class="label">SPAN · authorize</text>
  <rect x="335" y="152" width="70" height="20" rx="4" class="s"/>
  <text x="345" y="166" class="mono">0.12s</text>

  <!-- Row 4: inventory-service -->
  <text x="88" y="204" class="mono">inventory-service</text>
  <text x="88" y="219" class="label">SPAN · reserveStock</text>
  <rect x="415" y="192" width="300" height="20" rx="4" class="s"/>
  <text x="425" y="206" class="mono">1.78s</text>

  <!-- Row 5: the slow DB span (highlighted danger) -->
  <text x="112" y="244" class="danger">postgres</text>
  <text x="112" y="259" class="danger">SPAN · SELECT … FOR UPDATE</text>
  <rect x="425" y="232" width="280" height="20" rx="4" class="fs"/>
  <rect x="425" y="232" width="280" height="20" rx="4" class="dg"/>
  <text x="435" y="246" class="danger">1.74s · ROW LOCK CONTENTION</text>

  <!-- callout -->
  <line x1="565" y1="252" x2="565" y2="284" class="dg"/>
  <polygon points="565,284 560,274 570,274" class="fd"/>
  <text x="400" y="306" text-anchor="middle" class="danger">THE TIME ISN'T "SOMEWHERE" · IT'S THIS ONE DB CALL ON THIS ONE REQUEST</text>

  <line x1="40" y1="326" x2="760" y2="326" class="sm"/>
  <text x="40" y="348" class="label">SPANS NEST INTO A WATERFALL · INDENT = PARENT/CHILD · BAR LENGTH = WALL-CLOCK TIME</text>
</svg>
