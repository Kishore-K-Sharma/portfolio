<svg viewBox="0 0 800 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-when">
  <title id="t-when">When to reach for edge versus serverless</title>
  <style>
    .text{fill:#1a1a24;font-family:Inter,system-ui,sans-serif;font-size:12.5px}
    .label{fill:#5c5c66;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:10.5px;letter-spacing:.08em}
    .mono{fill:#1a1a24;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11.5px}
    .acc{fill:#6028d9;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11px}
    .danger{fill:#c14545;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11px}
    .s{stroke:#1a1a24;fill:none;stroke-width:1.25}
    .a{stroke:#6028d9;fill:none;stroke-width:1.5}
    .fs{fill:#f5f1e6}
    @media (prefers-color-scheme: dark){
      .text{fill:#e8e4d8}.label{fill:#9c9ca6}.mono{fill:#e8e4d8}.acc{fill:#b89be8}.danger{fill:#d97a7a}
      .s{stroke:#e8e4d8}.a{stroke:#b89be8}.fs{fill:#1a1a24}
    }
  </style>

  <rect x="0" y="0" width="800" height="360" class="fs"/>
  <text x="40" y="34" class="label">SHORT + LATENCY-CRITICAL VS HEAVY + POWERFUL</text>

  <!-- EDGE column -->
  <rect x="40" y="58" width="340" height="240" rx="4" class="a"/>
  <text x="58" y="86" class="acc">REACH FOR EDGE</text>
  <line x1="58" y1="98" x2="362" y2="98" class="a" stroke-dasharray="4 4"/>
  <text x="58" y="126" class="mono">→ auth checks at the door</text>
  <text x="58" y="152" class="mono">→ redirects</text>
  <text x="58" y="178" class="mono">→ geo / A/B / personalization</text>
  <text x="58" y="204" class="mono">→ header rewriting</text>
  <text x="58" y="230" class="mono">→ light API glue</text>
  <text x="58" y="256" class="mono">→ streaming responses</text>
  <text x="58" y="286" class="acc">SHORT · LATENCY-CRITICAL · ON THE PATH</text>

  <!-- SERVERLESS column -->
  <rect x="420" y="58" width="340" height="240" rx="4" class="s"/>
  <text x="438" y="86" class="text" style="font-weight:700">REACH FOR SERVERLESS</text>
  <line x1="438" y1="98" x2="742" y2="98" class="s" stroke-dasharray="4 4"/>
  <text x="438" y="126" class="mono">→ heavy compute</text>
  <text x="438" y="152" class="mono">→ long-running jobs</text>
  <text x="438" y="178" class="mono">→ big deps / native libs</text>
  <text x="438" y="204" class="mono">→ direct database sockets</text>
  <text x="438" y="230" class="mono">→ anything needing full Node</text>
  <text x="438" y="256" class="mono">→ real memory + time budgets</text>
  <text x="438" y="286" class="text" style="font-weight:700">HEAVY · POWERFUL · OFF THE HOT PATH</text>

  <text x="40" y="344" class="label">EDGE = THIN FAST LAYER AT THE DOOR · SERVERLESS = HEAVY MACHINERY IN THE BACK</text>
</svg>
