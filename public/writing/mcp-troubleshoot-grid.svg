<svg viewBox="0 0 800 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-mcp-trouble">
  <title id="t-mcp-trouble">MCP wiring troubleshoot grid: four symptoms, four causes</title>
  <style>
    .text{fill:#1a1a24;font-family:Inter,system-ui,sans-serif;font-size:12.5px}
    .label{fill:#5c5c66;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:10.5px;letter-spacing:.08em}
    .mono{fill:#1a1a24;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11px}
    .acc{fill:#6028d9;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11px}
    .danger{fill:#c14545;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:10.5px;letter-spacing:.08em}
    .s{stroke:#1a1a24;fill:none;stroke-width:1.25}
    .sm{stroke:#b3b3bd;fill:none;stroke-width:1;stroke-dasharray:4 4}
    .a{stroke:#6028d9;fill:none;stroke-width:1.5}
    .dg{stroke:#c14545;fill:none;stroke-width:1.5}
    .fa{fill:#6028d9}
    .fd{fill:#c14545}
    .fs{fill:#f5f1e6}
    @media (prefers-color-scheme: dark){
      .text{fill:#e8e4d8}.label{fill:#9c9ca6}.mono{fill:#e8e4d8}.acc{fill:#b89be8}.danger{fill:#d97a7a}
      .s{stroke:#e8e4d8}.sm{stroke:#4a4a55}.a{stroke:#b89be8}.dg{stroke:#d97a7a}
      .fa{fill:#b89be8}.fd{fill:#d97a7a}.fs{fill:#1a1a24}
    }
  </style>

  <text x="40" y="36" class="label">DIAGNOSE BY SYMPTOM · DON'T TWEAK EVERYTHING AT ONCE</text>

  <!-- Q1: top-left -->
  <rect x="40" y="64" width="350" height="130" rx="4" class="s"/>
  <text x="60" y="88" class="danger">SYMPTOM · TOOL NOT IN /MCP</text>
  <line x1="60" y1="100" x2="370" y2="100" class="sm"/>
  <text x="60" y="124" class="acc">CAUSE</text>
  <text x="60" y="142" class="text">config not loaded.</text>
  <text x="60" y="166" class="acc">FIX</text>
  <text x="60" y="184" class="text">restart claude code · check ~/.claude.json syntax.</text>

  <!-- Q2: top-right -->
  <rect x="410" y="64" width="350" height="130" rx="4" class="s"/>
  <text x="430" y="88" class="danger">SYMPTOM · LISTED BUT 0 TOOLS</text>
  <line x1="430" y1="100" x2="740" y2="100" class="sm"/>
  <text x="430" y="124" class="acc">CAUSE</text>
  <text x="430" y="142" class="text">server crashed on startup.</text>
  <text x="430" y="166" class="acc">FIX</text>
  <text x="430" y="184" class="text">run `npx tsx /abs/path/server.ts` from fresh shell.</text>

  <!-- Q3: bottom-left -->
  <rect x="40" y="210" width="350" height="130" rx="4" class="s"/>
  <text x="60" y="234" class="danger">SYMPTOM · MODEL PICKS WRONG TOOL</text>
  <line x1="60" y1="246" x2="370" y2="246" class="sm"/>
  <text x="60" y="270" class="acc">CAUSE</text>
  <text x="60" y="288" class="text">description doesn't differentiate.</text>
  <text x="60" y="312" class="acc">FIX</text>
  <text x="60" y="330" class="text">add "use this when…" and "do NOT use this for…".</text>

  <!-- Q4: bottom-right -->
  <rect x="410" y="210" width="350" height="130" rx="4" class="s"/>
  <text x="430" y="234" class="danger">SYMPTOM · WRONG INPUT SHAPE</text>
  <line x1="430" y1="246" x2="740" y2="246" class="sm"/>
  <text x="430" y="270" class="acc">CAUSE</text>
  <text x="430" y="288" class="text">schema fields missing examples.</text>
  <text x="430" y="312" class="acc">FIX</text>
  <text x="430" y="330" class="text">add .describe() with concrete examples to each field.</text>
</svg>
