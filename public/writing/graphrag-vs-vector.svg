<svg viewBox="0 0 800 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-graphrag-vs">
  <title id="t-graphrag-vs">Vector top-K returns disconnected chunks that can't answer a multi-hop question; a graph traversal connects them across two edges</title>
  <style>
    .text{fill:#1a1a24;font-family:Inter,system-ui,sans-serif;font-size:13px}
    .label{fill:#5c5c66;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:10.5px;letter-spacing:.08em}
    .mono{fill:#1a1a24;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11.5px}
    .acc{fill:#6028d9;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11px}
    .danger{fill:#c14545;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:10.5px;letter-spacing:.08em}
    .s{stroke:#1a1a24;fill:none;stroke-width:1.25}
    .sm{stroke:#b3b3bd;fill:none;stroke-width:1;stroke-dasharray:4 4}
    .a{stroke:#6028d9;fill:none;stroke-width:1.5}
    .dg{stroke:#c14545;fill:none;stroke-width:1.25}
    .fa{fill:#6028d9}
    .fd{fill:#c14545}
    .fs{fill:#f5f1e6}
    @media (prefers-color-scheme: dark){
      .text{fill:#e8e4d8}.label{fill:#9c9ca6}.mono{fill:#e8e4d8}.acc{fill:#b89be8}.danger{fill:#d97a7a}
      .s{stroke:#e8e4d8}.sm{stroke:#4a4a55}.a{stroke:#b89be8}.dg{stroke:#d97a7a}
      .fa{fill:#b89be8}.fd{fill:#d97a7a}.fs{fill:#1a1a24}
    }
  </style>

  <text x="40" y="34" class="label">QUESTION · "WHICH ENGINEERS WORK ON SERVICES THAT DEPEND ON THE BILLING DB?"</text>

  <!-- divider -->
  <line x1="400" y1="60" x2="400" y2="340" class="sm"/>

  <!-- LEFT: vector top-K -->
  <text x="40" y="80" class="acc">VECTOR TOP-K</text>
  <text x="40" y="98" class="label">NEAREST CHUNKS · NO LINKS BETWEEN THEM</text>

  <rect x="40" y="118" width="150" height="46" rx="4" class="dg"/>
  <text x="52" y="138" class="text">chunk: "Priya owns</text>
  <text x="52" y="154" class="text">the invoices service"</text>

  <rect x="210" y="118" width="150" height="46" rx="4" class="dg"/>
  <text x="222" y="138" class="text">chunk: "billing DB</text>
  <text x="222" y="154" class="text">stores ledgers"</text>

  <rect x="40" y="186" width="150" height="46" rx="4" class="dg"/>
  <text x="52" y="206" class="text">chunk: "dunning job</text>
  <text x="52" y="222" class="text">runs nightly"</text>

  <rect x="210" y="186" width="150" height="46" rx="4" class="dg"/>
  <text x="222" y="206" class="text">chunk: "team roster</text>
  <text x="222" y="222" class="text">Q2 update"</text>

  <text x="40" y="262" class="danger">✕ NO CHUNK LINKS PRIYA → INVOICES → BILLING DB</text>
  <text x="40" y="282" class="danger">✕ ANSWER IS SPREAD ACROSS CHUNKS · NEVER IN ONE</text>
  <text x="40" y="316" class="text" font-size="14">Model guesses, or says "I don't know."</text>

  <!-- RIGHT: graph traversal -->
  <text x="440" y="80" class="acc">GRAPH · TRAVERSE 2 EDGES</text>
  <text x="440" y="98" class="label">NODES = ENTITIES · EDGES = RELATIONSHIPS</text>

  <!-- node: Priya -->
  <rect x="440" y="130" width="92" height="40" rx="4" class="a"/>
  <text x="486" y="155" text-anchor="middle" class="mono">Priya</text>

  <!-- node: invoices svc -->
  <rect x="600" y="130" width="120" height="40" rx="4" class="s"/>
  <text x="660" y="148" text-anchor="middle" class="text">invoices</text>
  <text x="660" y="163" text-anchor="middle" class="label">SERVICE</text>

  <!-- node: billing db -->
  <rect x="600" y="248" width="120" height="40" rx="4" class="s"/>
  <text x="660" y="266" text-anchor="middle" class="text">billing</text>
  <text x="660" y="281" text-anchor="middle" class="label">DATABASE</text>

  <!-- edge Priya -> invoices -->
  <line x1="532" y1="150" x2="596" y2="150" class="a"/>
  <polygon points="600,150 590,145 590,155" class="fa"/>
  <text x="540" y="142" class="label">OWNS</text>

  <!-- edge invoices -> billing -->
  <line x1="660" y1="170" x2="660" y2="244" class="a"/>
  <polygon points="660,248 655,238 665,238" class="fa"/>
  <text x="668" y="212" class="label">DEPENDS_ON</text>

  <text x="440" y="316" class="acc">✓ PRIYA —OWNS→ INVOICES —DEPENDS_ON→ BILLING DB</text>
  <text x="440" y="336" class="label">THE PATH IS THE ANSWER</text>
</svg>
