<svg viewBox="0 0 800 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-evjudge">
  <title id="t-evjudge">LLM-as-judge: candidates plus a rubric go to a judge model that reasons then scores, with its bias failure modes and mitigations</title>
  <style>
    .text{fill:#1a1a24;font-family:Inter,system-ui,sans-serif;font-size:12.5px}
    .label{fill:#5c5c66;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:10.5px;letter-spacing:.08em}
    .mono{fill:#1a1a24;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11px}
    .acc{fill:#6028d9;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11px}
    .danger{fill:#c14545;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11px}
    .s{stroke:#1a1a24;fill:none;stroke-width:1.25}
    .a{stroke:#6028d9;fill:none;stroke-width:1.5}
    .dg{stroke:#c14545;fill:none;stroke-width:1.25}
    .fa{fill:#6028d9}
    .fdgc{fill:#c14545;opacity:0.10}
    .fac{fill:#6028d9;opacity:0.08}
    .fs{fill:#f5f1e6}
    @media (prefers-color-scheme: dark){
      .text{fill:#e8e4d8}.label{fill:#9c9ca6}.mono{fill:#e8e4d8}.acc{fill:#b89be8}.danger{fill:#d97a7a}
      .s{stroke:#e8e4d8}.a{stroke:#b89be8}.dg{stroke:#d97a7a}.fa{fill:#b89be8}
      .fdgc{fill:#d97a7a;opacity:0.16}.fac{fill:#b89be8;opacity:0.14}.fs{fill:#1a1a24}
    }
  </style>

  <rect x="0" y="0" width="800" height="360" class="fs"/>
  <text x="40" y="28" class="label">LLM-AS-JUDGE · A STRONG MODEL APPROXIMATES HUMAN JUDGMENT AT SCALE</text>

  <!-- Inputs -->
  <rect x="40" y="48" width="180" height="60" rx="4" class="s"/>
  <text x="58" y="72" class="text" style="font-weight:700">CANDIDATES</text>
  <text x="58" y="94" class="mono">output A · output B</text>

  <rect x="40" y="124" width="180" height="60" rx="4" class="s"/>
  <text x="58" y="148" class="text" style="font-weight:700">RUBRIC</text>
  <text x="58" y="170" class="mono">explicit criteria, 1–5</text>

  <!-- Judge -->
  <rect x="300" y="60" width="170" height="112" rx="4" class="fac"/>
  <rect x="300" y="60" width="170" height="112" rx="4" class="a"/>
  <text x="385" y="94" text-anchor="middle" class="acc">JUDGE MODEL</text>
  <text x="385" y="120" text-anchor="middle" class="text">strong model,</text>
  <text x="385" y="140" text-anchor="middle" class="text">reasons before</text>
  <text x="385" y="160" text-anchor="middle" class="text">it commits</text>

  <!-- Verdict -->
  <rect x="550" y="60" width="210" height="112" rx="4" class="s"/>
  <text x="568" y="94" class="acc">VERDICT</text>
  <text x="568" y="120" class="mono">1. reasoning (CoT)</text>
  <text x="568" y="142" class="mono">2. score / winner</text>
  <text x="568" y="164" class="text">pairwise + win-rate</text>

  <line x1="220" y1="78" x2="298" y2="100" class="a"/>
  <polygon points="298,100 287,98 291,90" class="fa"/>
  <line x1="220" y1="154" x2="298" y2="132" class="a"/>
  <polygon points="298,132 291,142 287,134" class="fa"/>
  <line x1="470" y1="116" x2="548" y2="116" class="a"/>
  <polygon points="548,116 538,111 538,121" class="fa"/>

  <!-- Bias band -->
  <rect x="40" y="200" width="720" height="60" rx="4" class="fdgc"/>
  <rect x="40" y="200" width="720" height="60" rx="4" class="dg"/>
  <text x="58" y="224" class="danger">BIAS FAILURE MODES · THE JUDGE CAN BE GAMED</text>
  <text x="58" y="248" class="mono">position/order · verbosity (longer wins) · self-preference · rubric-wording sensitivity</text>

  <!-- Mitigation band -->
  <rect x="40" y="276" width="720" height="60" rx="4" class="fac"/>
  <rect x="40" y="276" width="720" height="60" rx="4" class="a"/>
  <text x="58" y="300" class="acc">MITIGATIONS · EARN THE TRUST FIRST</text>
  <text x="58" y="324" class="mono">swap order &amp; average · CoT before score · calibrate vs human labels (Cohen's κ)</text>
</svg>
