<svg viewBox="0 0 800 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-sdv">
  <title id="t-sdv">A small draft model proposes k tokens; the big target model verifies all of them in one forward pass</title>
  <style>
    .text{fill:#1a1a24;font-family:Inter,system-ui,sans-serif;font-size:12.5px}
    .label{fill:#5c5c66;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:10.5px;letter-spacing:.08em}
    .mono{fill:#1a1a24;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11px}
    .acc{fill:#6028d9;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11px}
    .danger{fill:#c14545;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11px}
    .s{stroke:#1a1a24;fill:none;stroke-width:1.25}
    .a{stroke:#6028d9;fill:none;stroke-width:1.5}
    .dg{stroke:#c14545;fill:none;stroke-width:1.25}
    .fs{fill:#f5f1e6}
    @media (prefers-color-scheme: dark){
      .text{fill:#e8e4d8}.label{fill:#9c9ca6}.mono{fill:#e8e4d8}.acc{fill:#b89be8}.danger{fill:#d97a7a}
      .s{stroke:#e8e4d8}.a{stroke:#b89be8}.dg{stroke:#d97a7a}.fs{fill:#1a1a24}
    }
  </style>

  <rect x="0" y="0" width="800" height="360" class="fs"/>
  <text x="40" y="34" class="label">DRAFT CHEAPLY · VERIFY ALL AT ONCE</text>

  <!-- DRAFT side -->
  <text x="40" y="72" class="acc">DRAFT MODEL  (small · fast)</text>
  <text x="40" y="90" class="mono">k quick passes, one token each</text>

  <!-- four small draft passes, sequential -->
  <rect x="40"  y="108" width="70" height="48" rx="4" class="a"/>
  <rect x="130" y="108" width="70" height="48" rx="4" class="a"/>
  <rect x="220" y="108" width="70" height="48" rx="4" class="a"/>
  <rect x="310" y="108" width="70" height="48" rx="4" class="a"/>
  <text x="75"  y="137" text-anchor="middle" class="acc">t1</text>
  <text x="165" y="137" text-anchor="middle" class="acc">t2</text>
  <text x="255" y="137" text-anchor="middle" class="acc">t3</text>
  <text x="345" y="137" text-anchor="middle" class="acc">t4</text>
  <path d="M110 132 L130 132" class="a"/>
  <path d="M200 132 L220 132" class="a"/>
  <path d="M290 132 L310 132" class="a"/>
  <text x="40" y="180" class="label">CHEAP: TINY WEIGHTS · SEQUENTIAL BUT SMALL</text>

  <!-- proposed sequence handed off -->
  <path d="M210 200 L210 232" class="s"/>
  <text x="228" y="222" class="text">propose k=4 candidate tokens →</text>

  <!-- TARGET side -->
  <text x="40" y="264" class="text" style="font-weight:700">TARGET MODEL  (big · expensive)</text>
  <rect x="40" y="278" width="500" height="58" rx="4" class="s"/>
  <text x="60" y="304" class="text">ONE forward pass scores all 4 positions in parallel</text>
  <text x="60" y="324" class="mono">t1  t2  t3  t4   → target's own probability per slot</text>

  <!-- cost callout -->
  <rect x="576" y="108" width="184" height="120" rx="4" class="a"/>
  <text x="596" y="134" class="acc">THE TRICK</text>
  <text x="596" y="158" class="text">loading the big</text>
  <text x="596" y="176" class="text">weights costs the</text>
  <text x="596" y="194" class="text">same whether you</text>
  <text x="596" y="212" class="text">score 1 token or 4</text>

  <rect x="576" y="278" width="184" height="58" rx="4" class="s"/>
  <text x="596" y="304" class="mono">1 expensive pass</text>
  <text x="596" y="324" class="mono">= up to 4 tokens</text>
</svg>
